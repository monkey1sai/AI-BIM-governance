name: Agent-ready implementation task
description: Structured vertical slice for Codex or another coding agent.
title: "[Agent Task] "
labels:
  - agent-ready
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this template only after material design fog is resolved. One ticket should be a vertically verifiable slice that fits one fresh agent context.
        Requirement truth starts at repo-local `AGENTS.md` and `docs/plans/docs-plans-README.md`.
        A/B/C are reusable Agent profiles, not pre-created slots or worktrees. This Issue may select a reviewed validation profile but must never provide commands for a self-hosted runner.
  - type: textarea
    id: requirement_source
    attributes:
      label: Requirement source
      description: Link the single owning spec, plan, issue, route contract, or work-shaping decision ticket. Do not duplicate the requirement here.
      placeholder: "docs/plans/AI-BIM 前後端設計文件.dc.html §07 CH-B"
    validations:
      required: true
  - type: textarea
    id: parent_and_blockers
    attributes:
      label: Parent and blockers
      description: Link the parent capability and every blocking ticket. Write "none" only when this slice is on the frontier.
      placeholder: |
        Parent: #123
        Blocked by: #124, #125
    validations:
      required: true
  - type: dropdown
    id: agent_profile
    attributes:
      label: Agent profile
      description: Select the Cloud capability profile. Multiple tasks may use the same profile concurrently; this does not reserve a local slot.
      options:
        - A — Contract / Governance
        - B — Runtime / Backend / Kit
        - C — Viewer / Frontend
    validations:
      required: true
  - type: input
    id: cloud_base_sha
    attributes:
      label: Cloud base SHA
      description: Full commit SHA the Cloud task must checkout. Do not use a branch name or mutable ref.
      placeholder: "0123456789abcdef0123456789abcdef01234567"
    validations:
      required: true
  - type: textarea
    id: expected_touch_set
    attributes:
      label: Expected touch set
      description: List comma-separated repo-relative paths or allowed globs. Negated globs and commands are not supported. Actual PR paths outside this set require maintainer review before local approval.
      placeholder: "web-viewer-sample/src/**, web-viewer-sample/e2e/**"
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Concrete, observable behavior. For user-facing work include route, button, fixture, visible result, and evidence path.
      placeholder: |
        - Frontend route:
        - Button tested:
        - Fixture:
        - Expected visible result:
        - Evidence path:
    validations:
      required: true
  - type: textarea
    id: context_packet
    attributes:
      label: Fresh-context packet
      description: "Carry only the facts needed to start this ticket: resolved decisions, blocker outcomes, affected boundaries, and known risks. Do not paste the full discovery conversation."
      placeholder: |
        Resolved decisions:
        Blocker outcomes:
        Entry symbols/routes:
        Known risks:
    validations:
      required: true
  - type: dropdown
    id: local_validation_profile
    attributes:
      label: Local validation profile
      description: Select only a protected-default-branch allowlist key. `full` is the normalized complete-system name; never use `full-system`.
      options:
        - contracts
        - integration
        - browser-e2e
        - kit-runtime
        - full
    validations:
      required: true
  - type: textarea
    id: local_only_checks_outstanding
    attributes:
      label: Local-only checks outstanding
      description: Name checks Cloud cannot truthfully run because they require local IFC, GPU, Kit, WebRTC, browser runtime, or host services. Write `none` only when all selected-profile checks are Cloud-capable.
      placeholder: |
        - Kit WebRTC first-frame / stage / DataChannel evidence
        - Real IFC fixture flow
    validations:
      required: true
  - type: dropdown
    id: deployment_requirement
    attributes:
      label: Deployment requirement
      description: This records post-merge intent only. A PR candidate can never deploy or receive deployment secrets.
      options:
        - none
        - required after merge from protected main
    validations:
      required: true
  - type: textarea
    id: evidence_contract
    attributes:
      label: Evidence contract
      description: Required artifacts, screenshots, traces, reports, runtime IDs, or explicit non-applicability reason.
      placeholder: "artifacts/e2e/<slug>/trace.zip and screenshot path, or explain why not applicable."
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

name: Agent-ready implementation task
description: Structured task for Codex or another coding agent.
title: "[Agent Task] "
labels:
  - agent-ready
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this template when a coding agent should read a requirement, change code or docs, run validation, and prepare a PR.
        Requirement truth starts at repo-local `AGENTS.md` and `docs/plans/docs-plans-README.md`.
  - type: textarea
    id: requirement_source
    attributes:
      label: Requirement source
      description: Link the exact spec, plan, issue, or route contract. Prefer `docs/plans/...` and `docs/superpowers/...`.
      placeholder: "docs/plans/TARGET-shell.md #a1 節 IX-A1-02"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: Name the repo areas that may change and anything that must not change.
      placeholder: "May change web-viewer-sample/src/...; do not change deploy.ps1 or runtime ports."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Concrete, observable behavior. For user-facing work include route, button, fixture, visible result, and evidence path.
      placeholder: |
        - Frontend route:
        - Button tested:
        - Fixture:
        - Expected visible result:
        - Evidence path:
    validations:
      required: true
  - type: textarea
    id: validation_commands
    attributes:
      label: Validation commands
      description: Exact commands the agent should run before opening or updating a PR.
      placeholder: |
        .\scripts\deploy.ps1 -DryRun
        .\scripts\verify-all.ps1
    validations:
      required: true
  - type: textarea
    id: evidence_contract
    attributes:
      label: Evidence contract
      description: Required artifacts, screenshots, traces, reports, or runtime IDs.
      placeholder: "artifacts/e2e/<slug>/trace.zip and screenshot path, or explain why not applicable."
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

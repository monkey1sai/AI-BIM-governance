name: Governance Base Audit

# Security boundary: pull_request_target and pull_request_review load this file
# from the default branch. Candidate files are checked out as inert data only;
# no script, action, hook, or dependency from candidate/ is executed. GitHub
# binds pull_request_target runs to the default-branch SHA, so this workflow is
# deliberately diagnostic. A separately credentialed GitHub App must publish
# the required, source-pinned check on the candidate head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governance-trust-root-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trust-root:
    name: governance-base-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse non-default PR bases
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$PR_BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Governance Base Audit only trusts the repository default branch."
            exit 1
          fi

      - name: Checkout trusted base policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate as inert data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Collect server-authoritative review identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "$RUNNER_TEMP/reviews.json"
          gh api "/repos/${REPOSITORY}/collaborators/monkey1sai-blip/permission" \
            > "$RUNNER_TEMP/reviewer-permission.json"

      - name: Enforce base-owned monotonic governance
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          env -u PYTHONPATH python -I trusted-base/scripts/dev/check_governance_trust_root.py \
            --base-root trusted-base \
            --candidate-root candidate \
            --head-sha "$HEAD_SHA" \
            --reviews-json "$RUNNER_TEMP/reviews.json" \
            --permission-json "$RUNNER_TEMP/reviewer-permission.json" \
            --format json \
            --output "$RUNNER_TEMP/governance-trust-root-result.json"
          status=$?
          if ! python -m json.tool "$RUNNER_TEMP/governance-trust-root-result.json"; then
            exit 1
          fi
          exit "$status"

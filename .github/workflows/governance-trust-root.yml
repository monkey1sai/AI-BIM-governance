name: Governance Base Audit

# Security boundary: pull_request_target and pull_request_review load this file
# from the default branch. Candidate files are checked out as inert data only;
# no script, action, hook, or dependency from candidate/ is executed. GitHub
# binds pull_request_target runs to the default-branch SHA, so this workflow is
# deliberately diagnostic. A separately credentialed GitHub App must publish
# the required, source-pinned check on the candidate head.
# Review-migration contract: the trusted-base checker consumes only the
# canonical policy (scripts/autonomous-codex-review-policy.json), its committed
# schema (scripts/tests/autonomous-codex-review-policy.schema.json), and the
# committed OpenSpec source
# (openspec/changes/parallel-delivery-fabric/specs/parallel-delivery-fabric/spec.md).
# Candidate copies cannot override those inputs. The default LEGACY_GUARDED
# phase retains the counted review; this workflow does not advance phases.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governance-trust-root-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trust-root:
    name: governance-base-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse non-default PR bases
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$PR_BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Governance Base Audit only trusts the repository default branch."
            exit 1
          fi

      - name: Checkout trusted base policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate as inert data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned OpenSpec exists in trusted base history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PINNED_SOURCE_SHA: a024a13a2ea2b7037acbf6a916d5dda8d125d27f
          PINNED_SOURCE_PATH: openspec/changes/parallel-delivery-fabric/specs/parallel-delivery-fabric/spec.md
          PINNED_SOURCE_SHA256: fb3d378d17688721238516061ac8fe9d8e45d2d6d8566adb083269518367a0ae
        run: |
          set -euo pipefail
          git -C trusted-base merge-base --is-ancestor "$PINNED_SOURCE_SHA" "$BASE_SHA"
          observed_digest="$(git -C trusted-base cat-file blob "${PINNED_SOURCE_SHA}:${PINNED_SOURCE_PATH}" | sha256sum | awk '{print $1}')"
          test "$observed_digest" = "$PINNED_SOURCE_SHA256"

      - name: Collect server-authoritative review identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "$RUNNER_TEMP/reviews.json"
          gh api "/repos/${REPOSITORY}/collaborators/monkey1sai-blip/permission" \
            > "$RUNNER_TEMP/reviewer-permission.json"

      - name: Enforce base-owned monotonic governance
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          env -u PYTHONPATH python -I trusted-base/scripts/dev/check_governance_trust_root.py \
            --base-root trusted-base \
            --candidate-root candidate \
            --head-sha "$HEAD_SHA" \
            --reviews-json "$RUNNER_TEMP/reviews.json" \
            --permission-json "$RUNNER_TEMP/reviewer-permission.json" \
            --format json \
            --output "$RUNNER_TEMP/governance-trust-root-result.json"
          status=$?
          if ! python -m json.tool "$RUNNER_TEMP/governance-trust-root-result.json"; then
            exit 1
          fi
          exit "$status"

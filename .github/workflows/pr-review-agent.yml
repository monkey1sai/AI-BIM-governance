name: PR Metadata Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-metadata-contract:
    name: pr-metadata-contract-diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture NUL-safe changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git -c core.quotepath=false diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.bin"

      - name: Materialize the base-pinned gate
        # A PR that edits the checker or its libraries must not get to adjudicate
        # itself with its own edited copy: the gate scripts are taken from the PR
        # BASE revision. First-introduction fallback: when the base predates the
        # gate files, the head copy is the only copy - acceptable exactly once,
        # because a base without a gate has nothing to weaken.
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/trusted-gate"
          mkdir -p "$trusted"
          if git cat-file -e "$BASE_SHA:scripts/tests/check-pr-body-evidence.ps1" 2>/dev/null; then
            git archive "$BASE_SHA" scripts docs/plans | tar -x -C "$trusted"
            echo "GATE_ROOT=$trusted" >> "$GITHUB_ENV"
            if grep -q 'PrNumber' "$trusted/scripts/tests/check-pr-body-evidence.ps1"; then
              echo "GATE_HAS_PRNUMBER=1" >> "$GITHUB_ENV"
            else
              echo "GATE_HAS_PRNUMBER=0" >> "$GITHUB_ENV"
            fi
          else
            echo "GATE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            echo "GATE_HAS_PRNUMBER=1" >> "$GITHUB_ENV"
          fi

      - name: Check PR body metadata without retaining raw body
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          $artifactRoot = 'artifacts/pr-metadata-contract'
          $bodyPath = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          [IO.File]::WriteAllText($bodyPath, [string]$env:PR_BODY, [Text.UTF8Encoding]::new($false))
          $result = 'failed'
          try {
            # Gate scripts come from the base-pinned copy (GATE_ROOT); data
            # (RepoRoot, shas, body) still describes the PR under review.
            $checkerPath = Join-Path $env:GATE_ROOT 'scripts/tests/check-pr-body-evidence.ps1'
            $checkerArguments = @(
              '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $checkerPath,
              '-BodyPath', $bodyPath,
              '-ChangedPathsPath', (Join-Path $env:RUNNER_TEMP 'changed-paths.bin'),
              '-ChangedPathsNulDelimited',
              '-RepoRoot', '${{ github.workspace }}',
              '-BaseSha', $env:BASE_SHA,
              '-HeadSha', $env:HEAD_SHA
            )
            if ($env:GATE_HAS_PRNUMBER -eq '1') {
              $checkerArguments += @('-PrNumber', [string][int]$env:PR_NUMBER)
            }
            pwsh @checkerArguments
            if ($LASTEXITCODE -ne 0) { throw 'PR body metadata contract failed.' }
            $result = 'passed'
          } finally {
            [ordered]@{
              schema_version = 'pr-metadata-contract/v1'
              result = $result
              base_sha = $env:BASE_SHA
              subject_sha = $env:HEAD_SHA
              body_sha256 = (Get-FileHash -LiteralPath $bodyPath -Algorithm SHA256).Hash.ToLowerInvariant()
              raw_body_retained = $false
            } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $artifactRoot 'result.json') -Encoding utf8
            Remove-Item -LiteralPath $bodyPath -Force
          }

      - name: Summarize local-preflight policy
        shell: pwsh
        run: |
          $summary = @'
          # PR Metadata Contract (diagnostic)

          Required PR validation is split by authority:

          - PR body metadata is present and non-placeholder; the raw body is never retained in the artifact.
          - Changed-path scope is derived from the base/head design manifests; the PR body cannot self-select an easier screen.
          - The `design-semantic-visual` CI job is the only semantic/pixel producer for approved or mixed frontend product changes. PR-provided JSON is never gate input.
          - `PR Metadata Contract` is the branch-protected PR-head metadata check; it does not aggregate artifacts or publish a separate merge status.
          - `scripts/dev/check-pr-local-preflight.ps1 -PrNumber <n>` is the authoritative local gate for PR review agent and affected sub-repo verification before push.
          - Functional/runtime operability evidence remains an independent requirement and cannot be replaced by the design job. Until its machine producer/validator and required check exist, full-completion claims remain forbidden.
          '@
          $summary | Set-Content -LiteralPath artifacts/pr-metadata-contract/summary.md -Encoding utf8
          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-metadata-contract-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/pr-metadata-contract
          if-no-files-found: error

name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-review-agent:
    name: pr-review-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR body evidence
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          New-Item -ItemType Directory -Path artifacts/pr-review-agent -Force | Out-Null
          $env:PR_BODY | Set-Content -LiteralPath artifacts/pr-review-agent/pr-body.md -Encoding utf8
          git -c core.quotepath=false diff --name-only '${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}' | Set-Content -LiteralPath artifacts/pr-review-agent/changed-paths.txt -Encoding utf8
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/check-pr-body-evidence.ps1 `
            -BodyPath artifacts/pr-review-agent/pr-body.md `
            -ChangedPathsPath artifacts/pr-review-agent/changed-paths.txt `
            -RepoRoot ${{ github.workspace }} `
            -BaseSha '${{ github.event.pull_request.base.sha }}' `
            -HeadSha '${{ github.event.pull_request.head.sha }}'

      - name: Summarize local-preflight policy
        shell: pwsh
        run: |
          $summary = @'
          # PR Review Agent

          CI does not rerun local-reproducible review or service verification on pull requests.
          Required PR validation is:

          - PR body machine evidence is present and non-placeholder.
          - `scripts/dev/check-pr-local-preflight.ps1 -PrNumber <n>` is the authoritative local gate for PR review agent and affected sub-repo verification before push.
          - Full service CI remains available on `push` to `main` and `workflow_dispatch`.
          '@
          $summary | Set-Content -LiteralPath artifacts/pr-review-agent/pr-review-agent.md -Encoding utf8
          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-agent-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/pr-review-agent
          if-no-files-found: error

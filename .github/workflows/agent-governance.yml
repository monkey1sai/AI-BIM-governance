name: Agent Governance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-governance:
    name: agent-governance
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js for PNG recomputation tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: web-viewer-sample/package-lock.json

      - name: Pin npm version
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -Command "npm install --global npm@10.9.4 --no-audit --no-fund"

      - name: Install design-gate Node dependencies
        shell: pwsh
        working-directory: web-viewer-sample
        run: pwsh -NoProfile -NonInteractive -Command "npm ci --no-audit --no-fund"

      - name: Run governance static check
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-agent-governance-check.ps1

      - name: Verify OpenSpec lifecycle state
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/verify-openspec-lifecycle.ps1 -BaseRef '${{ github.event.pull_request.base.sha }}'

      - name: Run PR body evidence tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-pr-body-evidence.ps1

      - name: Run browser-evidence hook tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-require-gstack-evidence.ps1

      - name: Run design-system reference gate tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-design-system-reference.ps1

      - name: Run design-system changed-path scope tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-design-system-change-scope.ps1

      - name: Run functional-runtime result gate tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-functional-runtime-result.ps1

      - name: Run design-system visual-result gate tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-design-system-visual-result.ps1

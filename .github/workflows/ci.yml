  powershell-static:
    name: powershell static analysis
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.powershell_static == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer errors
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          pwsh -NoProfile -NonInteractive -File scripts/tests/invoke-powershell-static.ps1

      - name: Run spec-to-done port helper safety tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-spec-to-done-port-helper.ps1

      - name: Run spec-to-done port helper safety tests (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-spec-to-done-port-helper.ps1

  rebuild-test-deploy:
    name: rebuild/test-deploy contracts
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.rebuild_test_deploy == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run rebuild transaction safety tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-rebuild-test-deploy.ps1

      - name: Run rebuild transaction safety tests (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-rebuild-test-deploy.ps1

      - name: Run aggregate verifier profile tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-verify-all.ps1

      # scripts/lib/host-native-launcher.ps1 is classified into this job, but no
      # workflow ever ran its suite: the process-tree containment regressions
      # were green only in manually recorded evidence, so a broken terminator
      # could merge. PowerShell 7 only - the dynamic fixtures use
      # ProcessStartInfo.ArgumentList, which .NET Framework does not have.
      - name: Run host-native launcher contract tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-host-native-launcher.ps1

  secret-pattern-scan:
    name: secret pattern scan
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.secret_pattern_scan == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pinned Node.js for security policy
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'

      - name: Scan high-signal secret patterns
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/scan-secret-patterns.ps1

      - name: Validate canonical security exceptions
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/verify-security-exceptions.ps1

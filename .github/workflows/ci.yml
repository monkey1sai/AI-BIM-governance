name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed path classifier
    runs-on: ubuntu-latest
    outputs:
      root_contracts: ${{ steps.paths.outputs.root_contracts }}
      coordinator: ${{ steps.paths.outputs.coordinator }}
      governance_service: ${{ steps.paths.outputs.governance_service }}
      viewer: ${{ steps.paths.outputs.viewer }}
      kit_manager_api: ${{ steps.paths.outputs.kit_manager_api }}
      kit_manager_web: ${{ steps.paths.outputs.kit_manager_web }}
      compose_config: ${{ steps.paths.outputs.compose_config }}
      powershell_static: ${{ steps.paths.outputs.powershell_static }}
      secret_pattern_scan: ${{ steps.paths.outputs.secret_pattern_scan }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c core.quotepath=false diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' > changed-paths.txt
          else
            printf "__full__\n" > changed-paths.txt
          fi

          emit() {
            local name="$1"
            local pattern="$2"
            if grep -qx "__full__" changed-paths.txt || grep -Eq "$pattern" changed-paths.txt; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit root_contracts '^(tests/|scripts/tests/)'
          emit coordinator '^bim-review-coordinator/'
          emit governance_service '^(governance-service/|rules/)'
          emit viewer '^(web-viewer-sample/|bim-review-coordinator/(src|public)/|docs/plans/.*prototype\.html)'
          emit kit_manager_api '^services/kit-manager-api/'
          emit kit_manager_web '^apps/kit-manager-web/'
          emit compose_config '^(compose\..*\.yml|\.env.*\.example|infra/docker/)'
          emit powershell_static '^(\.github/workflows/|\.claude/workflows/|scripts/.*\.ps1$|AGENTS\.md|docs/agents/)'
          echo "secret_pattern_scan=true" >> "$GITHUB_OUTPUT"

  root-contracts:
    name: root contracts and fakes
    needs: changes
    if: needs.changes.outputs.root_contracts == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run root contracts and fakes
        shell: pwsh
        run: python -m pytest tests -q -p no:cacheprovider

  coordinator:
    name: coordinator build and tests
    needs: changes
    if: needs.changes.outputs.coordinator == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bim-review-coordinator/package-lock.json

      - name: Install dependencies
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm ci

      - name: Run verify
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm run verify

  governance-service:
    name: governance-service tests
    needs: changes
    if: needs.changes.outputs.governance_service == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r governance-service/requirements.txt ifcopenshell usd-core pytest httpx

      - name: Run tests
        shell: pwsh
        run: python -m pytest governance-service/tests -q

  viewer:
    name: viewer build and tests
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm install --no-audit --no-fund

      - name: Run verify
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run verify

      - name: Run session-first contract
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run test:session-first

  kit-manager-api:
    name: kit-manager-api tests
    needs: changes
    if: needs.changes.outputs.kit_manager_api == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/kit-manager-api/requirements.txt pytest

      - name: Run tests
        shell: pwsh
        run: python -m pytest services/kit-manager-api/tests -q

  kit-manager-web:
    name: kit-manager-web build
    needs: changes
    if: needs.changes.outputs.kit_manager_web == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        working-directory: apps/kit-manager-web
        run: npm install --no-audit --no-fund

      - name: Build
        shell: pwsh
        working-directory: apps/kit-manager-web
        run: npm run build

  compose-config:
    name: docker compose config
    needs: changes
    if: needs.changes.outputs.compose_config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate compose config
        run: |
          docker compose version
          docker compose -f compose.runtime-manager.yml -f compose.host-kit.yml --env-file .env.web-plane.host-kit.example config --quiet

  powershell-static:
    name: powershell static analysis
    needs: changes
    if: needs.changes.outputs.powershell_static == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer errors
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host 'No PSScriptAnalyzer Error severity findings.'

  secret-pattern-scan:
    name: secret pattern scan
    needs: changes
    if: needs.changes.outputs.secret_pattern_scan == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Scan high-signal secret patterns
        shell: pwsh
        run: |
          $pattern = 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{50,}|xox[baprs]-[A-Za-z0-9-]+'
          $matches = git grep -nE $pattern -- . ':(exclude)*.example' ':(exclude)package-lock.json' ':(exclude)tests/**'
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            Write-Error "Potential secret pattern found:`n$matches"
            exit 1
          }
          if ($exitCode -eq 1) {
            Write-Host 'No high-signal secret patterns found.'
            exit 0
          }
          exit $exitCode

name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata-only' || 'verification' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changed path classifier
    runs-on: ubuntu-latest
    outputs:
      root_contracts: ${{ steps.paths.outputs.root_contracts }}
      coordinator: ${{ steps.paths.outputs.coordinator }}
      streaming: ${{ steps.paths.outputs.streaming }}
      governance_service: ${{ steps.paths.outputs.governance_service }}
      viewer: ${{ steps.paths.outputs.viewer }}
      agent_governance: ${{ steps.paths.outputs.agent_governance }}
      conv_functional: ${{ steps.paths.outputs.conv_functional }}
      kit_manager_api: ${{ steps.paths.outputs.kit_manager_api }}
      kit_manager_web: ${{ steps.paths.outputs.kit_manager_web }}
      compose_config: ${{ steps.paths.outputs.compose_config }}
      powershell_static: ${{ steps.paths.outputs.powershell_static }}
      rebuild_test_deploy: ${{ steps.paths.outputs.rebuild_test_deploy }}
      secret_pattern_scan: ${{ steps.paths.outputs.secret_pattern_scan }}
      frontend_product: ${{ steps.design_scope.outputs.frontend_product }}
      frontend_visual_required: ${{ steps.design_scope.outputs.frontend_visual_required }}
      frontend_design_status: ${{ steps.design_scope.outputs.frontend_design_status }}
      frontend_required_screen_ids: ${{ steps.design_scope.outputs.frontend_required_screen_ids }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
      plan_result: ${{ steps.paths.outputs.plan_result }}
      plan_sha256: ${{ steps.paths.outputs.plan_sha256 }}
    steps:
      - name: Checkout
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for the shared classifier
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'

      - name: Classify changed paths
        id: paths
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          SUBJECT_SHA: ${{ github.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="$PULL_REQUEST_BASE_SHA"
            head_sha="$PULL_REQUEST_HEAD_SHA"
            git -c core.quotepath=false diff --no-renames --name-only -z "$base_sha...$head_sha" > changed-paths.bin
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
            head_sha="$SUBJECT_SHA"
            if ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$base_sha" =~ ^0{40}$ ]]; then
              echo "::error::merge_group immutable base SHA is missing or invalid" >&2
              exit 1
            fi
            if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$head_sha" =~ ^0{40}$ ]]; then
              echo "::error::merge_group subject SHA is missing or invalid" >&2
              exit 1
            fi
            git -c core.quotepath=false diff --no-renames --name-only -z "$base_sha...$head_sha" > changed-paths.bin
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$SUBJECT_SHA"
            git -c core.quotepath=false diff --no-renames --name-only -z "$base_sha" "$head_sha" > changed-paths.bin
          else
            printf "__full__\0" > changed-paths.bin
            base_sha=''
            head_sha="$SUBJECT_SHA"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          planner_args=(
            --manifest scripts/verification-manifest.json
            --changed-paths0-file changed-paths.bin
            --subject "$head_sha"
            --json-out verification-plan.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -n "$base_sha" ]; then
            planner_args+=(--base "$base_sha")
          fi
          node scripts/lib/verification-plan.mjs "${planner_args[@]}"

      - name: Upload commit-bound verification plan
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-plan-${{ steps.paths.outputs.head_sha }}-attempt-${{ github.run_attempt }}
          path: verification-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Classify frontend design scope from base and head manifests
        id: design_scope
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        shell: pwsh
        run: |
          $verificationPlan = Get-Content -LiteralPath verification-plan.json -Raw | ConvertFrom-Json -Depth 100
          $paths = @($verificationPlan.changed_paths | Where-Object { $_ -ne '__full__' })
          if ($verificationPlan.dispatch -eq 'full') {
            $frontendProduct = 'true'
            $visualRequired = 'true'
            $status = 'mixed'
            $referenceMissing = 'full-dispatch'
            $requiredScreenIds = @((Get-Content -LiteralPath 'docs/plans/design-system-reference.manifest.json' -Raw | ConvertFrom-Json).screens | ForEach-Object { [string]$_.id }) -join ','
          } else {
            . ./scripts/lib/design-system-gate.ps1
            $scope = Get-DesignSystemChangeScope `
              -RepoRoot '${{ github.workspace }}' `
              -ChangedPaths $paths `
              -BaseSha '${{ steps.paths.outputs.base_sha }}' `
              -HeadSha '${{ steps.paths.outputs.head_sha }}'
            if ($scope.status -like '*_fail_closed') {
              throw "Design scope failed closed: status=$($scope.status); unknown=$($scope.unknown_paths -join ', '); reference-authority=$($scope.reference_authority_paths -join ', ')"
            }
            $frontendProduct = $scope.frontend_product.ToString().ToLowerInvariant()
            $visualRequired = $scope.visual_required.ToString().ToLowerInvariant()
            $status = [string]$scope.status
            $referenceMissing = @($scope.reference_missing_items) -join ','
            $requiredScreenIds = @($scope.required_screen_ids) -join ','
          }
          if ($frontendProduct -notin @('true', 'false') -or $visualRequired -notin @('true', 'false')) {
            throw 'Design scope booleans are not canonical.'
          }
          if ($status -notin @('passed', 'mixed', 'partial_reference_missing', 'gate_infrastructure_only', 'not_applicable')) {
            throw "Design scope status is not an allowed non-failing enum: $status"
          }
          $screenIds = @($requiredScreenIds.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() })
          if (@($screenIds | Where-Object { $_ -notmatch '^[a-z0-9][a-z0-9.-]{0,63}$' }).Count -gt 0) {
            throw 'Design scope contains an unsafe screen id.'
          }
          "frontend_product=$frontendProduct" >> $env:GITHUB_OUTPUT
          "frontend_visual_required=$visualRequired" >> $env:GITHUB_OUTPUT
          "frontend_design_status=$status" >> $env:GITHUB_OUTPUT
          "frontend_required_screen_ids=$($screenIds -join ',')" >> $env:GITHUB_OUTPUT

  platform-adapter-linux:
    # Dual-platform equivalence evidence for the deploy-path ownership primitives
    # (plan B3): the same suite that agent-governance runs on windows-latest runs
    # here on ubuntu-latest. Deliberately NOT a required check (adding names to
    # branch protection is a separate decision).
    name: platform adapter (linux)
    needs: changes
    # NOT a required check, so it deliberately omits the always()+classifier-failure
    # pattern: the skipped-success hazard only exists for required checks, where a
    # skip would satisfy branch protection. A non-required job simply skips when the
    # classifier fails, which is why it carries no "Require classifier success" guard.
    if: needs.changes.outputs.agent_governance == 'true' || needs.changes.outputs.rebuild_test_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run platform adapter tests (linux)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-platform-adapter.ps1

      - name: Parse and dry-run Linux target provisioner
        shell: bash
        run: |
          bash -n scripts/dev/provision-linux-deploy-target.sh
          bash scripts/dev/provision-linux-deploy-target.sh --dry-run deploy-fixture

      - name: Run deploy target registry tests (linux)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/tests/test-deploy-target-registry.ps1

  root-contracts:
    name: root contracts and fakes
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.root_contracts == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run agent persona and skill-root parity
        shell: pwsh
        run: python -m pytest tests/test_agent_persona_parity.py tests/test_skill_manifest_roots.py -q -p no:cacheprovider

      - name: Run root contracts and fakes
        shell: pwsh
        run: python -m pytest tests -q -p no:cacheprovider

  coordinator:
    name: coordinator build and tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.coordinator == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: bim-review-coordinator/package-lock.json

      - name: Install dependencies
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run verify
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm run verify

  streaming:
    name: streaming stage-loading contract
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.streaming == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run stage-loading contract
        shell: pwsh
        working-directory: bim-streaming-server
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-stage-loading-contract.ps1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bim-streaming-server/requirements.txt

      - name: Install conversion service test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bim-streaming-server/requirements.txt pytest pytest-asyncio httpx

      - name: Run host-native conversion service tests
        shell: pwsh
        run: python -m pytest bim-streaming-server/tests/test_host_native_conversion_service.py -q

  governance-service:
    name: governance-service tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.governance_service == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: governance-service/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r governance-service/requirements.txt ifcopenshell usd-core pytest httpx

      - name: Run tests
        shell: pwsh
        run: python -m pytest governance-service/tests -q

  viewer:
    name: viewer build and tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.viewer == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: web-viewer-sample/package-lock.json

      - name: Install pinned npm
        shell: pwsh
        run: npm install --global npm@10.9.4 --no-audit --no-fund

      - name: Install dependencies
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm ci --no-audit --no-fund

      - name: Run verify
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run verify

      - name: Resolve trusted ESLint baseline
        id: eslint-baseline
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'viewer-eslint-baseline.json'
          if ($env:TRUSTED_BASE_SHA -match '^[0-9a-f]{40}$' -and $env:TRUSTED_BASE_SHA -notmatch '^0{40}$') {
            $content = @(git show "$($env:TRUSTED_BASE_SHA):web-viewer-sample/scripts/eslint-baseline.json" 2>$null)
            if ($LASTEXITCODE -eq 0) {
              [IO.File]::WriteAllText($target, (($content -join [Environment]::NewLine) + "`n"), [Text.UTF8Encoding]::new($false))
            } else {
              $baseManifest = @(git show "$($env:TRUSTED_BASE_SHA):scripts/verification-manifest.json" 2>$null) -join "`n"
              if ($baseManifest -match 'verification-manifest/v2') { throw 'trusted base ESLint baseline is unavailable' }
              $baseWorktree = Join-Path $env:RUNNER_TEMP 'viewer-eslint-base'
              if (Test-Path -LiteralPath $baseWorktree) { throw 'trusted base ESLint worktree path already exists' }
              git worktree add --detach $baseWorktree $env:TRUSTED_BASE_SHA
              if ($LASTEXITCODE -ne 0) { throw 'unable to materialize trusted base viewer source' }
              try {
                $baseViewer = Join-Path $baseWorktree 'web-viewer-sample'
                Push-Location $baseViewer
                try {
                  npm ci --no-audit --no-fund
                  if ($LASTEXITCODE -ne 0) { throw 'unable to install trusted base viewer dependencies' }
                } finally {
                  Pop-Location
                }
                $baselineScript = Join-Path $env:GITHUB_WORKSPACE 'web-viewer-sample/scripts/check-eslint-baseline.mjs'
                $content = @(& node $baselineScript --print-baseline --source-root $baseViewer)
                if ($LASTEXITCODE -ne 0) { throw 'unable to derive ESLint baseline from trusted base source' }
                [IO.File]::WriteAllText($target, (($content -join [Environment]::NewLine) + "`n"), [Text.UTF8Encoding]::new($false))
              } finally {
                git worktree remove --force $baseWorktree
                if ($LASTEXITCODE -ne 0) { throw 'unable to remove trusted base ESLint worktree' }
              }
            }
          } else {
            if ($env:EVENT_NAME -eq 'merge_group') {
              throw 'merge_group requires an immutable trusted base SHA; candidate HEAD fallback is forbidden.'
            }
            Copy-Item -LiteralPath 'web-viewer-sample/scripts/eslint-baseline.json' -Destination $target
          }
          "path=$target" >> $env:GITHUB_OUTPUT

      - name: Reject new ESLint debt against shrink-only baseline
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run lint:baseline -- --trusted-baseline '${{ steps.eslint-baseline.outputs.path }}'

      - name: Run session-first contract
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run test:session-first

  design-semantic-visual:
    name: design-semantic-visual
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.frontend_product == 'true')
    runs-on: windows-2025
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout exact subject commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.changes.outputs.head_sha }}

      - name: Validate pinned desigin-system manifest and baselines
        shell: pwsh
        env:
          REQUIRED_SCREEN_IDS: ${{ needs.changes.outputs.frontend_required_screen_ids }}
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/tests/verify-design-system-reference.ps1 -RepoRoot '${{ github.workspace }}'
          $requiredScreenIds = @($env:REQUIRED_SCREEN_IDS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() })
          $headScreenIds = @((Get-Content -LiteralPath 'docs/plans/design-system-reference.manifest.json' -Raw | ConvertFrom-Json).screens | ForEach-Object { [string]$_.id })
          $missingScreenIds = @($requiredScreenIds | Where-Object { $_ -notin $headScreenIds })
          if ($missingScreenIds.Count -gt 0) { throw "Head manifest removed base-approved screen IDs: $($missingScreenIds -join ', ')" }

      - name: Record honest reference-missing partial scope
        if: needs.changes.outputs.frontend_visual_required != 'true'
        shell: pwsh
        run: |
          "Design gate status: ${{ needs.changes.outputs.frontend_design_status }}" >> $env:GITHUB_STEP_SUMMARY
          'No pixel result is fabricated. Functional/runtime evidence remains an independent required gate and full completion is forbidden.' >> $env:GITHUB_STEP_SUMMARY

      - name: Setup Node.js
        if: needs.changes.outputs.frontend_visual_required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: web-viewer-sample/package-lock.json

      - name: Install pinned npm
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        run: npm install --global npm@10.9.4 --no-audit --no-fund

      - name: Install viewer dependencies
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm ci --no-audit --no-fund

      - name: Cache pinned Playwright browsers
        if: needs.changes.outputs.frontend_visual_required == 'true'
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('web-viewer-sample/package-lock.json') }}

      - name: Install pinned Playwright Chromium
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
        run: npx playwright install chromium

      - name: Produce semantic and pixel evidence from current checkout
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
        run: npm run test:visual:design-system

      - name: Recompute and validate design result
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        env:
          REQUIRED_SCREEN_IDS: ${{ needs.changes.outputs.frontend_required_screen_ids }}
        run: |
          $requiredScreenIds = @($env:REQUIRED_SCREEN_IDS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() })
          # dot-source in-process instead of spawning a nested `pwsh -File` process: passing a
          # multi-element array across that process boundary flattens it into separate command-line
          # tokens, which PowerShell then mis-binds onto later positional parameters (observed: a
          # screen id landing on -MaxAgeHours). In-process invocation preserves the array natively.
          . ./scripts/tests/verify-design-system-visual-result.ps1 `
            -RepoRoot '${{ github.workspace }}' `
            -ResultPath '${{ github.workspace }}/artifacts/e2e/design-system-visual-result.json' `
            -RequiredScreenIds $requiredScreenIds `
            -TargetCommit '${{ needs.changes.outputs.head_sha }}' `
            -AllowUntrackedArtifacts

      - name: Upload design evidence
        if: always() && needs.changes.outputs.frontend_visual_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-semantic-visual-${{ needs.changes.outputs.head_sha }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/e2e/design-system-visual-result.json
            artifacts/e2e/design-system-visual/
            artifacts/e2e/design-system-playwright/
          if-no-files-found: error

  functional-runtime-conv:
    name: functional-runtime-conv
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.conv_functional == 'true')
    runs-on: windows-2025
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success functional/runtime check.'

      - name: Checkout exact subject commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.changes.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: |
            bim-review-coordinator/package-lock.json
            web-viewer-sample/package-lock.json

      - name: Install coordinator dependencies
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install viewer dependencies
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Cache pinned Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('web-viewer-sample/package-lock.json') }}

      - name: Install pinned Playwright Chromium
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
        run: npx playwright install chromium

      - name: Build coordinator-served viewer
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run build:ui

      - name: Produce current-subject functional/runtime evidence
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
          E2E_DISABLE_WEBSERVER: '1'
        run: npx playwright test --config=playwright.functional-runtime.config.ts

      - name: Verify hifi token and legacy route runtime slice
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
          E2E_DISABLE_WEBSERVER: '1'
        run: npx playwright test e2e/hifi-token-authority.spec.ts --config=playwright.config.ts

      - name: Verify runtime command authority browser slice
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
        run: npx playwright test e2e/runtime-command-authority.spec.ts --config=playwright.config.ts

      - name: Validate functional/runtime evidence binding
        shell: pwsh
        run: >-
          pwsh -NoProfile -NonInteractive -File scripts/tests/verify-functional-runtime-result.ps1
          -RepoRoot '${{ github.workspace }}'
          -ResultPath '${{ github.workspace }}\artifacts\e2e\functional-runtime\functional-runtime-result.json'
          -TargetCommit '${{ needs.changes.outputs.head_sha }}'
          -AllowUntrackedArtifacts

      - name: Upload functional/runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-runtime-conv-${{ needs.changes.outputs.head_sha }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/e2e/functional-runtime/functional-runtime-result.json
            artifacts/e2e/functional-runtime/conv-history.png
            artifacts/e2e/functional-runtime/conv-history-trace.zip
            artifacts/e2e/hifi-token-authority/
            artifacts/e2e/_output/
          if-no-files-found: error

  kit-manager-api:
    name: kit-manager-api tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.kit_manager_api == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/kit-manager-api/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/kit-manager-api/requirements.txt pytest

      - name: Run tests
        shell: pwsh
        run: python -m pytest services/kit-manager-api/tests -q

  kit-manager-web:
    name: kit-manager-web build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.kit_manager_web == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: web-viewer-sample/package-lock.json

      - name: Install dependencies
        shell: pwsh
        working-directory: apps/kit-manager-web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build
        shell: pwsh
        working-directory: apps/kit-manager-web
        run: npm run build

      - name: Install pinned browser test harness
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Cache pinned Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('web-viewer-sample/package-lock.json') }}

      - name: Install pinned Playwright Chromium
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
        run: npx playwright install chromium

      - name: Verify Kit Manager operator flow through coordinator boundary
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
        run: npm run test:e2e:kit-manager

  compose-config:

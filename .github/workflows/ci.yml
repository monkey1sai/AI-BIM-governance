        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run rebuild transaction safety tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-rebuild-test-deploy.ps1

      - name: Run rebuild transaction safety tests (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-rebuild-test-deploy.ps1

      - name: Run aggregate verifier profile tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-verify-all.ps1

  secret-pattern-scan:

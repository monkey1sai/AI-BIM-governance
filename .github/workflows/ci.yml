name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed path classifier
    runs-on: ubuntu-latest
    outputs:
      root_contracts: ${{ steps.paths.outputs.root_contracts }}
      coordinator: ${{ steps.paths.outputs.coordinator }}
      governance_service: ${{ steps.paths.outputs.governance_service }}
      viewer: ${{ steps.paths.outputs.viewer }}
      conv_functional: ${{ steps.paths.outputs.conv_functional }}
      kit_manager_api: ${{ steps.paths.outputs.kit_manager_api }}
      kit_manager_web: ${{ steps.paths.outputs.kit_manager_web }}
      compose_config: ${{ steps.paths.outputs.compose_config }}
      powershell_static: ${{ steps.paths.outputs.powershell_static }}
      rebuild_test_deploy: ${{ steps.paths.outputs.rebuild_test_deploy }}
      secret_pattern_scan: ${{ steps.paths.outputs.secret_pattern_scan }}
      frontend_product: ${{ steps.design_scope.outputs.frontend_product }}
      frontend_visual_required: ${{ steps.design_scope.outputs.frontend_visual_required }}
      frontend_design_status: ${{ steps.design_scope.outputs.frontend_design_status }}
      frontend_reference_missing: ${{ steps.design_scope.outputs.frontend_reference_missing }}
      frontend_required_screen_ids: ${{ steps.design_scope.outputs.frontend_required_screen_ids }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha='${{ github.event.pull_request.base.sha }}'
            head_sha='${{ github.event.pull_request.head.sha }}'
            git -c core.quotepath=false diff --no-renames --name-only "$base_sha...$head_sha" > changed-paths.txt
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha='${{ github.event.before }}'
            head_sha='${{ github.sha }}'
            git -c core.quotepath=false diff --no-renames --name-only "$base_sha" "$head_sha" > changed-paths.txt
          else
            printf "__full__\n" > changed-paths.txt
            base_sha=''
            head_sha='${{ github.sha }}'
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          emit() {
            local name="$1"
            local pattern="$2"
            if grep -qx "__full__" changed-paths.txt || grep -Eq "$pattern" changed-paths.txt; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit root_contracts '^(tests/|scripts/tests/)'
          emit coordinator '^bim-review-coordinator/'
          emit governance_service '^(governance-service/|rules/)'
          emit viewer '^(web-viewer-sample/|bim-review-coordinator/(src|public)/|docs/plans/(.*prototype\.html|design-system-reference\.manifest\.json|design-system-baseline/))'
          emit conv_functional '^(\.github/workflows/ci\.yml|bim-review-coordinator/|docs/plans/design-system-reference\.manifest\.json|scripts/tests/(test|verify)-functional-runtime-result\.ps1|web-viewer-sample/)'
          emit kit_manager_api '^services/kit-manager-api/'
          emit kit_manager_web '^apps/kit-manager-web/'
          emit compose_config '^(compose\..*\.yml|\.env.*\.example|infra/docker/)'
          emit powershell_static '^(\.github/workflows/|\.claude/workflows/|scripts/.*\.(ps1|psm1)$|AGENTS\.md|docs/agents/)'
          emit rebuild_test_deploy '^scripts/(deploy\.ps1|dev/rebuild-test-deploy\.ps1|lib/(rebuild-test-deploy|design-assets|host-native-launcher)\.ps1|lib/StructLog\.psm1|tests/(test-rebuild-test-deploy|test-verify-all|test-helpers)\.ps1)$'
          echo "secret_pattern_scan=true" >> "$GITHUB_OUTPUT"

      - name: Classify frontend design scope from base and head manifests
        id: design_scope
        shell: pwsh
        run: |
          $paths = @(Get-Content -LiteralPath changed-paths.txt | Where-Object { $_ })
          if ($paths -contains '__full__') {
            $frontendProduct = 'true'
            $visualRequired = 'true'
            $status = 'mixed'
            $referenceMissing = 'full-dispatch'
            $requiredScreenIds = @((Get-Content -LiteralPath 'docs/plans/design-system-reference.manifest.json' -Raw | ConvertFrom-Json).screens | ForEach-Object { [string]$_.id }) -join ','
          } else {
            . ./scripts/lib/design-system-gate.ps1
            $scope = Get-DesignSystemChangeScope `
              -RepoRoot '${{ github.workspace }}' `
              -ChangedPaths $paths `
              -BaseSha '${{ steps.paths.outputs.base_sha }}' `
              -HeadSha '${{ steps.paths.outputs.head_sha }}'
            if ($scope.status -like '*_fail_closed') {
              throw "Design scope failed closed: status=$($scope.status); unknown=$($scope.unknown_paths -join ', '); reference-authority=$($scope.reference_authority_paths -join ', ')"
            }
            $frontendProduct = $scope.frontend_product.ToString().ToLowerInvariant()
            $visualRequired = $scope.visual_required.ToString().ToLowerInvariant()
            $status = [string]$scope.status
            $referenceMissing = @($scope.reference_missing_items) -join ','
            $requiredScreenIds = @($scope.required_screen_ids) -join ','
          }
          "frontend_product=$frontendProduct" >> $env:GITHUB_OUTPUT
          "frontend_visual_required=$visualRequired" >> $env:GITHUB_OUTPUT
          "frontend_design_status=$status" >> $env:GITHUB_OUTPUT
          "frontend_reference_missing=$referenceMissing" >> $env:GITHUB_OUTPUT
          "frontend_required_screen_ids=$requiredScreenIds" >> $env:GITHUB_OUTPUT

  root-contracts:
    name: root contracts and fakes
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.root_contracts == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run root contracts and fakes
        shell: pwsh
        run: python -m pytest tests -q -p no:cacheprovider

  coordinator:
    name: coordinator build and tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.coordinator == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bim-review-coordinator/package-lock.json

      - name: Install dependencies
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm ci

      - name: Run verify
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm run verify

  governance-service:
    name: governance-service tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.governance_service == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r governance-service/requirements.txt ifcopenshell usd-core pytest httpx

      - name: Run tests
        shell: pwsh
        run: python -m pytest governance-service/tests -q

  viewer:
    name: viewer build and tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.viewer == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: web-viewer-sample/package-lock.json

      - name: Pin npm version
        shell: pwsh
        run: npm install --global npm@10.9.4 --no-audit --no-fund

      - name: Install dependencies
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm ci --no-audit --no-fund

      - name: Run verify
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run verify

      - name: Run session-first contract
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run test:session-first

  design-semantic-visual:
    name: design-semantic-visual
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.frontend_product == 'true')
    runs-on: windows-2025
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout exact subject commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.changes.outputs.head_sha }}

      - name: Validate pinned desigin-system manifest and baselines
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/tests/verify-design-system-reference.ps1 -RepoRoot '${{ github.workspace }}'
          $requiredScreenIds = @('${{ needs.changes.outputs.frontend_required_screen_ids }}'.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() })
          $headScreenIds = @((Get-Content -LiteralPath 'docs/plans/design-system-reference.manifest.json' -Raw | ConvertFrom-Json).screens | ForEach-Object { [string]$_.id })
          $missingScreenIds = @($requiredScreenIds | Where-Object { $_ -notin $headScreenIds })
          if ($missingScreenIds.Count -gt 0) { throw "Head manifest removed base-approved screen IDs: $($missingScreenIds -join ', ')" }

      - name: Record honest reference-missing partial scope
        if: needs.changes.outputs.frontend_visual_required != 'true'
        shell: pwsh
        run: |
          "Design gate status: ${{ needs.changes.outputs.frontend_design_status }}" >> $env:GITHUB_STEP_SUMMARY
          "Reference missing: ${{ needs.changes.outputs.frontend_reference_missing }}" >> $env:GITHUB_STEP_SUMMARY
          'No pixel result is fabricated. Functional/runtime evidence remains an independent required gate and full completion is forbidden.' >> $env:GITHUB_STEP_SUMMARY

      - name: Setup Node.js
        if: needs.changes.outputs.frontend_visual_required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: web-viewer-sample/package-lock.json

      - name: Pin npm version
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        run: npm install --global npm@10.9.4 --no-audit --no-fund

      - name: Install viewer dependencies
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright Chromium
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        working-directory: web-viewer-sample
        run: npx playwright install chromium

      - name: Produce semantic and pixel evidence from current checkout
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run test:visual:design-system

      - name: Recompute and validate design result
        if: needs.changes.outputs.frontend_visual_required == 'true'
        shell: pwsh
        run: |
          $requiredScreenIds = @('${{ needs.changes.outputs.frontend_required_screen_ids }}'.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() })
          # dot-source in-process instead of spawning a nested `pwsh -File` process: passing a
          # multi-element array across that process boundary flattens it into separate command-line
          # tokens, which PowerShell then mis-binds onto later positional parameters (observed: a
          # screen id landing on -MaxAgeHours). In-process invocation preserves the array natively.
          . ./scripts/tests/verify-design-system-visual-result.ps1 `
            -RepoRoot '${{ github.workspace }}' `
            -ResultPath '${{ github.workspace }}/artifacts/e2e/design-system-visual-result.json' `
            -RequiredScreenIds $requiredScreenIds `
            -TargetCommit '${{ needs.changes.outputs.head_sha }}' `
            -AllowUntrackedArtifacts

      - name: Upload design evidence
        if: always() && needs.changes.outputs.frontend_visual_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-semantic-visual-${{ needs.changes.outputs.head_sha }}
          path: |
            artifacts/e2e/design-system-visual-result.json
            artifacts/e2e/design-system-visual/
            artifacts/e2e/design-system-playwright/
          if-no-files-found: warn

  functional-runtime-conv:
    name: functional-runtime-conv
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.conv_functional == 'true')
    runs-on: windows-2025
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success functional/runtime check.'

      - name: Checkout exact subject commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.changes.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: |
            bim-review-coordinator/package-lock.json
            web-viewer-sample/package-lock.json

      - name: Pin npm version
        shell: pwsh
        run: npm install --global npm@10.9.4 --no-audit --no-fund

      - name: Install coordinator dependencies
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm ci --no-audit --no-fund

      - name: Install viewer dependencies
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright Chromium
        shell: pwsh
        working-directory: web-viewer-sample
        run: npx playwright install chromium

      - name: Build coordinator-served viewer
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run build:ui

      - name: Produce current-subject functional/runtime evidence
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          E2E_DISABLE_WEBSERVER: '1'
        run: npx playwright test --config=playwright.functional-runtime.config.ts

      - name: Verify hifi token and legacy route runtime slice
        shell: pwsh
        working-directory: web-viewer-sample
        env:
          E2E_DISABLE_WEBSERVER: '1'
        run: npx playwright test e2e/hifi-token-authority.spec.ts --config=playwright.config.ts

      - name: Verify runtime command authority browser slice
        shell: pwsh
        working-directory: web-viewer-sample
        run: npx playwright test e2e/runtime-command-authority.spec.ts --config=playwright.config.ts

      - name: Validate functional/runtime evidence binding
        shell: pwsh
        run: >-
          pwsh -NoProfile -NonInteractive -File scripts/tests/verify-functional-runtime-result.ps1
          -RepoRoot '${{ github.workspace }}'
          -ResultPath '${{ github.workspace }}\artifacts\e2e\functional-runtime\functional-runtime-result.json'
          -TargetCommit '${{ needs.changes.outputs.head_sha }}'
          -AllowUntrackedArtifacts

      - name: Upload functional/runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-runtime-conv-${{ needs.changes.outputs.head_sha }}
          path: |
            artifacts/e2e/functional-runtime/functional-runtime-result.json
            artifacts/e2e/functional-runtime/conv-history.png
            artifacts/e2e/functional-runtime/conv-history-trace.zip
            artifacts/e2e/hifi-token-authority/
            artifacts/e2e/_output/
          if-no-files-found: error

  kit-manager-api:
    name: kit-manager-api tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.kit_manager_api == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/kit-manager-api/requirements.txt pytest

      - name: Run tests
        shell: pwsh
        run: python -m pytest services/kit-manager-api/tests -q

  kit-manager-web:
    name: kit-manager-web build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.kit_manager_web == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        working-directory: apps/kit-manager-web
        run: npm install --no-audit --no-fund

      - name: Build
        shell: pwsh
        working-directory: apps/kit-manager-web
        run: npm run build

  compose-config:
    name: docker compose config
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.compose_config == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate compose config
        run: |
          docker compose version
          docker compose -f compose.runtime-manager.yml -f compose.host-kit.yml --env-file .env.web-plane.host-kit.example config --quiet

  powershell-static:
    name: powershell static analysis
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.powershell_static == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer errors
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host 'No PSScriptAnalyzer Error severity findings.'

      - name: Run rebuild transaction safety tests (PowerShell 7)
        if: needs.changes.outputs.rebuild_test_deploy == 'true'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-rebuild-test-deploy.ps1

      - name: Run rebuild transaction safety tests (Windows PowerShell 5.1)
        if: needs.changes.outputs.rebuild_test_deploy == 'true'
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-rebuild-test-deploy.ps1

      - name: Run aggregate verifier profile tests
        if: needs.changes.outputs.rebuild_test_deploy == 'true'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/test-verify-all.ps1

  secret-pattern-scan:
    name: secret pattern scan
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.secret_pattern_scan == 'true')
    runs-on: windows-latest
    steps:
      - name: Require changed-path classifier success
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'changed path classifier did not succeed; refusing a skipped-success required check.'

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Scan high-signal secret patterns
        shell: pwsh
        run: |
          $pattern = 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{50,}|xox[baprs]-[A-Za-z0-9-]+'
          $matches = git grep -nE $pattern -- . ':(exclude)*.example' ':(exclude)package-lock.json' ':(exclude)tests/**'
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            Write-Error "Potential secret pattern found:`n$matches"
            exit 1
          }
          if ($exitCode -eq 1) {
            Write-Host 'No high-signal secret patterns found.'
            exit 0
          }
          exit $exitCode

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-contracts:
    name: root contracts and fakes
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run root contracts and fakes
        shell: pwsh
        run: python -m pytest tests -q -p no:cacheprovider

  coordinator:
    name: coordinator build and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bim-review-coordinator/package-lock.json

      - name: Install dependencies
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm ci

      - name: Run verify
        shell: pwsh
        working-directory: bim-review-coordinator
        run: npm run verify

  governance-service:
    name: governance-service tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r governance-service/requirements.txt ifcopenshell pytest httpx

      - name: Run tests
        shell: pwsh
        run: python -m pytest governance-service/tests -q

  viewer:
    name: viewer build and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-viewer-sample/package-lock.json

      - name: Install dependencies
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm ci

      - name: Run verify
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run verify

      - name: Run session-first contract
        shell: pwsh
        working-directory: web-viewer-sample
        run: npm run test:session-first

  kit-manager-api:
    name: kit-manager-api tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/kit-manager-api/requirements.txt pytest

      - name: Run tests
        shell: pwsh
        run: python -m pytest services/kit-manager-api/tests -q

  kit-manager-web:
    name: kit-manager-web build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        working-directory: apps/kit-manager-web
        run: npm install --no-audit --no-fund

      - name: Build
        shell: pwsh
        working-directory: apps/kit-manager-web
        run: npm run build

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate compose config
        run: |
          docker compose version
          docker compose -f compose.runtime-manager.yml -f compose.host-kit.yml --env-file .env.web-plane.host-kit.example config --quiet

  powershell-static:
    name: powershell static analysis
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer errors
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host 'No PSScriptAnalyzer Error severity findings.'

  secret-pattern-scan:
    name: secret pattern scan
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Scan high-signal secret patterns
        shell: pwsh
        run: |
          $pattern = 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{50,}|xox[baprs]-[A-Za-z0-9-]+'
          $matches = git grep -nE $pattern -- . ':(exclude)*.example' ':(exclude)package-lock.json' ':(exclude)tests/**'
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            Write-Error "Potential secret pattern found:`n$matches"
            exit 1
          }
          if ($exitCode -eq 1) {
            Write-Host 'No high-signal secret patterns found.'
            exit 0
          }
          exit $exitCode

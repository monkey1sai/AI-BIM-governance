name: PR Safety

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-safety:
    name: pr-safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Test safety checker
        run: node --test .github/scripts/pr-safety.test.mjs

      - name: Check changed content
        run: >-
          node .github/scripts/pr-safety.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

name: ${COMPOSE_PROJECT_NAME:-ai-bim-runtime-manager}

services:
  coordinator:
    environment:
      # Hybrid mode: web plane runs in Docker, NVIDIA Kit/conversion remain on host.
      HOST: 0.0.0.0
      PORT: 8004
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1}
      VIEWER_PORT: ${VIEWER_PORT:-5173}
      VIEWER_PUBLIC_BASE_URL: ${VIEWER_PUBLIC_BASE_URL:-http://${PUBLIC_HOST:-127.0.0.1}:${VIEWER_PORT:-5173}}
      COORDINATOR_PUBLIC_BASE_URL: ${COORDINATOR_PUBLIC_BASE_URL:-http://${PUBLIC_HOST:-127.0.0.1}:${COORDINATOR_PORT:-8004}}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://${PUBLIC_HOST:-127.0.0.1}:${VIEWER_PORT:-5173}}"
      STREAMING_CONVERSION_API_BASE: ${HOST_CONVERSION_API_BASE:-http://host.docker.internal:49101}
      CONVERSION_API_BASE: ${HOST_CONVERSION_API_BASE:-http://host.docker.internal:49101}
      # governance-service 永遠 host-native（CPU ifcopenshell，:49102），不在任何 compose 內。
      # dockerized coordinator 的 governance proxy 必須走 host.docker.internal 連回；
      # 否則 governanceApiBase() fallback 到 container loopback 127.0.0.1:49102 → 502 Bad Gateway。
      GOVERNANCE_API_BASE: ${HOST_GOVERNANCE_API_BASE:-http://host.docker.internal:49102}
      KIT_STREAM_SERVER: ${KIT_SIGNALING_HOST:-${PUBLIC_HOST:-127.0.0.1}}
      KIT_SIGNALING_PORT: ${KIT_SIGNALING_PORT:-49100}
      KIT_MEDIA_SERVER: ${KIT_MEDIA_HOST:-${KIT_SIGNALING_HOST:-${PUBLIC_HOST:-127.0.0.1}}}
      KIT_MEDIA_PORT: ${KIT_MEDIA_PORT:-47998}
      KIT_SPECTATOR_COUNT: ${KIT_SPECTATOR_COUNT:-5}
      KIT_SPECTATOR_SIGNALING_PORT_START: ${KIT_SPECTATOR_SIGNALING_PORT_START:-49110}
      KIT_SPECTATOR_MEDIA_PORT_START: ${KIT_SPECTATOR_MEDIA_PORT_START:-48008}
      KIT_SPECTATOR_PORT_STRIDE: ${KIT_SPECTATOR_PORT_STRIDE:-10}
      KIT_INSTANCE_ENDPOINTS: ${KIT_INSTANCE_ENDPOINTS:-}
      # IFC_DOWNLOAD_STRICT:控制 HTTP 取 IFC 失敗時的行為。
      # false(此 dev default):fetch 失敗時 fallback 寫 placeholder,demo loop 不中斷。
      # production MUST 設 "true":strict 下 HTTP 拿不到 IFC(non-2xx)直接回 502 +
      # download_status=failed,不靜默產 placeholder,避免假資料流入下游 conversion。
      IFC_DOWNLOAD_STRICT: "${IFC_DOWNLOAD_STRICT:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: !override
      - "${COORDINATOR_PORT:-8004}:8004"

  viewer:
    environment: !override
      VITE_COORDINATOR_API_BASE: "${WEB_VIEWER_COORDINATOR_API_BASE:-http://${PUBLIC_HOST:-127.0.0.1}:${COORDINATOR_PORT:-8004}}"
      VITE_COORDINATOR_SOCKET_URL: "${WEB_VIEWER_COORDINATOR_SOCKET_URL:-http://${PUBLIC_HOST:-127.0.0.1}:${COORDINATOR_PORT:-8004}}"
      VITE_ALLOWED_COORDINATOR_ORIGINS: "${VITE_ALLOWED_COORDINATOR_ORIGINS:-http://${PUBLIC_HOST:-127.0.0.1}:${COORDINATOR_PORT:-8004}}"
    ports: !override
      - "${VIEWER_BIND_HOST:-127.0.0.1}:${VIEWER_PORT:-5173}:5173"

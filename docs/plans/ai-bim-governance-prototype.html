<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI · BIM Governance — 操作介面原型</title>
<!-- Repo source artifact: paired with ai-bim-governance-設計規格.md as the A1-A10 product requirement prototype. -->
<style>
:root{
  --bg-0:#0c0f11; --bg-1:#13181b; --bg-2:#1a2024; --bg-3:#222a2f;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --tx-0:#eef3f4; --tx-1:#a9b6bb; --tx-2:#6f7d83; --tx-3:#56636a;
  --green:#84c714; --green-d:#5f9410; --green-soft:rgba(132,199,20,.14);
  --amber:#f2b43b; --amber-soft:rgba(242,180,59,.14);
  --cyan:#46c7e6; --cyan-soft:rgba(70,199,230,.14);
  --red:#f0635f; --red-soft:rgba(240,99,95,.13);
  --violet:#9a8cff; --violet-soft:rgba(154,140,255,.14);
  --radius:14px; --radius-sm:10px;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-0);color:var(--tx-0);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b343a;border-radius:8px;border:2px solid var(--bg-0)}
::-webkit-scrollbar-thumb:hover{background:#36424a}

#app{display:flex;flex-direction:column;height:100vh;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;background:linear-gradient(180deg,#11161a,#0e1316);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:226px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--green-d));display:grid;place-items:center;color:#0b0f06;font-weight:800;font-size:13px;box-shadow:0 0 0 1px rgba(132,199,20,.4),0 4px 12px rgba(132,199,20,.25)}
.brand b{font-size:14px;letter-spacing:.02em}
.brand small{display:block;color:var(--tx-2);font-family:var(--mono);font-size:9.5px;letter-spacing:.13em}
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg-2);font-size:12.5px;color:var(--tx-1);cursor:pointer;transition:.15s;white-space:nowrap}
.pill:hover{border-color:var(--line-2);background:var(--bg-3);color:var(--tx-0)}
.pill .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--tx-3)}
.pill .v{color:var(--tx-0);font-weight:600}
.pill .car{color:var(--tx-3);font-size:10px}
.spacer{flex:1}
.stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--tx-1);padding:0 8px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx-3)}
.dot.g{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.a{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.dot.c{background:var(--cyan)}
.dot.r{background:var(--red)}
.who{display:flex;align-items:center;gap:8px;padding-left:6px;border-left:1px solid var(--line);margin-left:2px}
.av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2a343a,#1c2429);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--tx-0);border:1px solid var(--line-2)}
.who .nm{font-size:12.5px;font-weight:600}.who .ro{font-size:10px;color:var(--tx-2);font-family:var(--mono)}

.shell{display:flex;flex:1;min-height:0}
.sidebar{width:230px;flex:0 0 auto;background:var(--bg-1);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 28px}
.navgroup{margin-top:14px}
.navgroup:first-child{margin-top:4px}
.navhead{display:flex;align-items:center;gap:8px;padding:6px 8px 8px}
.navhead .gl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--tx-2);text-transform:uppercase}
.navhead .gs{font-family:var(--mono);font-size:9px;color:var(--tx-3);margin-left:auto}
.nav{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;cursor:pointer;color:var(--tx-1);transition:.13s;margin:1px 0;position:relative}
.nav:hover{background:var(--bg-2);color:var(--tx-0)}
.nav.on{background:var(--green-soft);color:var(--tx-0)}
.nav.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--green)}
.nav .code{font-family:var(--mono);font-size:10px;font-weight:700;width:26px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--bg-3);color:var(--tx-1);flex:0 0 auto;border:1px solid var(--line)}
.nav.on .code{background:var(--green);color:#0b0f06;border-color:transparent}
.nav .t{font-size:13.5px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .bdg{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:6px;background:var(--bg-3);color:var(--tx-2)}
.nav .bdg.n{background:var(--red-soft);color:var(--red)}
.nav .bdg.p{background:var(--amber-soft);color:var(--amber)}

.workspace{flex:1;min-width:0;overflow-y:auto;background:radial-gradient(1200px 500px at 70% -10%,rgba(132,199,20,.05),transparent),var(--bg-0)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 30px 80px}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--tx-2);font-family:var(--mono);font-size:11px;margin-bottom:14px}
.crumbs b{color:var(--tx-1)}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px}
.phead .big{font-size:27px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.phead .sub{color:var(--tx-1);font-size:14px;margin-top:7px;max-width:760px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:4px 9px;border-radius:7px;border:1px solid var(--line);color:var(--tx-1);background:var(--bg-1)}
.chip.omni{color:var(--green);border-color:rgba(132,199,20,.35);background:var(--green-soft)}
.chip.core{color:var(--cyan);border-color:rgba(70,199,230,.3);background:var(--cyan-soft)}
.chip.mix{color:var(--violet);border-color:rgba(154,140,255,.3);background:var(--violet-soft)}
.chip.p0{color:var(--red)}.chip.p1{color:var(--amber)}.chip.p2{color:var(--tx-2)}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius);background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border:1px solid var(--line);margin:18px 0}
.callout .ic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-weight:800}
.callout .tt{font-weight:650;margin-bottom:2px;font-size:14px}
.callout .dd{color:var(--tx-1);font-size:13.5px}
.section-t{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-t .bar{width:3px;height:15px;border-radius:3px;background:var(--green)}
.section-t h3{font-size:15px;margin:0;font-weight:680}
.section-t .hint{color:var(--tx-2);font-size:12px;font-family:var(--mono)}
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:1180px){.g3{grid-template-columns:1fr 1fr}}
.mock{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mock .mt{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.mock .mt .lbl{color:var(--tx-2)}
.mock .mt .dots{display:flex;gap:5px;margin-left:auto}
.mock .mt .dots i{width:9px;height:9px;border-radius:50%;background:#2c353b;display:block}
.mock .mb{padding:16px}
.uianalysis{border:1px dashed rgba(132,199,20,.3);background:rgba(132,199,20,.04);border-radius:var(--radius);padding:6px 4px}
.uirow{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.uianalysis .uirow:last-child{border-bottom:0}
.uirow .where{flex:0 0 150px;font-family:var(--mono);font-size:11px;color:var(--green);letter-spacing:.03em;padding-top:1px}
.uirow .desc{color:var(--tx-1);font-size:13.5px}
.uirow .desc b{color:var(--tx-0);font-weight:620}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.kv .item{display:flex;flex-direction:column;gap:3px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-1);min-width:120px}
.kv .item .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx-2);text-transform:uppercase}
.kv .item .v{font-size:14px;font-weight:650}
.deps{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dep{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:7px;background:#10211f;border:1px solid rgba(70,199,230,.25);color:var(--cyan)}
.prov{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:4px 9px;border-radius:7px;border:1px solid var(--line)}
.prov:before{content:"";width:7px;height:7px;border-radius:50%}
.prov.built{color:var(--green);background:var(--green-soft);border-color:rgba(132,199,20,.3)}.prov.built:before{background:var(--green)}
.prov.art{color:var(--cyan);background:var(--cyan-soft);border-color:rgba(70,199,230,.3)}.prov.art:before{background:var(--cyan)}
.prov.demo{color:var(--amber);background:var(--amber-soft);border-color:rgba(242,180,59,.3)}.prov.demo:before{background:var(--amber)}
.prov.todo{color:var(--tx-2);border-style:dashed}.prov.todo:before{background:var(--tx-3)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--tx-0);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;font-family:var(--sans)}
.btn:hover{background:var(--bg-3);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--green),var(--green-d));color:#0b0f06;border-color:transparent;box-shadow:0 6px 16px rgba(132,199,20,.25)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn .kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.25);color:inherit;opacity:.7}
.btn.lg{height:46px;font-size:15px;padding:0 20px}
.actiongrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:1180px){.actiongrid{grid-template-columns:1fr 1fr}}
.act{position:relative;background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.16s;overflow:hidden}
.act:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.act .top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.act .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-weight:800;font-family:var(--mono)}
.act .pr{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--tx-2)}
.act h4{margin:0;font-size:15.5px;font-weight:680}
.act .small{color:var(--tx-2);font-family:var(--mono);font-size:10.5px;margin-top:1px}
.act p{color:var(--tx-1);font-size:13px;margin:9px 0 12px;min-height:36px}
.act .go{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--green);font-weight:600}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg-1);margin-bottom:9px;transition:.14s;cursor:pointer}
.todo:hover{border-color:var(--line-2);background:var(--bg-2)}
.todo .sev{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.todo .sev.c{background:var(--red);box-shadow:0 0 8px var(--red)}.todo .sev.h{background:var(--amber)}.todo .sev.m{background:var(--cyan)}
.todo .tt{font-weight:600;font-size:14px}
.todo .ds{color:var(--tx-2);font-size:12px;font-family:var(--mono)}
.todo .rt{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--tx-2);font-family:var(--mono);font-size:11px}
.todo .src{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:6px;background:var(--bg-3);color:var(--tx-1)}
.stepper{display:flex;align-items:center;gap:0;margin:6px 0 20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:.14s}
.step:hover{background:var(--bg-2)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--bg-3);color:var(--tx-2);border:1px solid var(--line)}
.step.done .n{background:var(--green);color:#0b0f06;border-color:transparent}
.step.cur .n{background:transparent;color:var(--green);border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.step .sl{font-size:13px;color:var(--tx-2);font-weight:600}
.step.cur .sl,.step.done .sl{color:var(--tx-0)}
.step .arr{color:var(--tx-3);margin:0 4px}
.stage{min-height:200px}
.dropzone{border:1.5px dashed var(--line-2);border-radius:var(--radius);padding:34px;text-align:center;background:var(--bg-1);transition:.16s}
.dropzone:hover{border-color:var(--green);background:var(--green-soft)}
.dropzone .di{width:54px;height:54px;border-radius:14px;background:var(--bg-3);display:grid;place-items:center;margin:0 auto 12px;font-size:22px}
.filechip{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid var(--line-2);border-radius:11px;background:var(--bg-2);margin-top:6px}
.progress{height:10px;border-radius:6px;background:var(--bg-3);overflow:hidden;margin:14px 0}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green-d),var(--green));transition:width .25s}
.runline{font-family:var(--mono);font-size:12px;color:var(--tx-1);padding:5px 0;display:flex;gap:9px;align-items:center}
.runline .ok{color:var(--green)}.runline .bad{color:var(--red)}
.scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 16px}
.score{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg-1);text-align:center}
.score .num{font-size:28px;font-weight:780;line-height:1;color:var(--tx-0)}
.score.pass .num{color:var(--green)}.score.fail .num{color:var(--red)}.score.warn .num{color:var(--amber)}
.score .lb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--tx-2);margin-top:6px;text-transform:uppercase}
.rule{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--bg-1)}
.rule .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px}
.rule.ok .ic{background:var(--green-soft);color:var(--green)}
.rule.bad .ic{background:var(--red-soft);color:var(--red)}
.rule .nm{font-weight:600;font-size:13.5px}
.rule .id{font-family:var(--mono);font-size:11px;color:var(--tx-2)}
.rule .cnt{margin-left:auto;font-family:var(--mono);font-size:12px}
.rule .sevt{font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:6px}
.rule .sevt.crit{background:var(--red-soft);color:var(--red)}.rule .sevt.warn{background:var(--amber-soft);color:var(--amber)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.diff .col{padding:14px}
.diff .col:first-child{border-right:1px solid var(--line)}
.diff .ch{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}
.diff .ch.add{background:rgba(132,199,20,.08)}
.diff .ch.del{background:rgba(240,99,95,.08)}
.diff .ch.mod{background:rgba(242,180,59,.08)}
.diff .ch .tag{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:5px}
.diff .ch.add .tag{background:var(--green);color:#0b0f06}.diff .ch.del .tag{background:var(--red);color:#fff}.diff .ch.mod .tag{background:var(--amber);color:#0b0f06}
.tl{height:46px;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);position:relative;margin:12px 0;overflow:hidden}
.tl .bar{position:absolute;top:8px;height:12px;border-radius:6px}
.tl .seek{position:absolute;top:0;bottom:0;width:2px;background:var(--green);box-shadow:0 0 8px var(--green)}
.vp{height:200px;border-radius:12px;border:1px solid var(--line);background:radial-gradient(700px 200px at 50% 120%,rgba(70,199,230,.12),transparent),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 28px),var(--bg-1);position:relative;overflow:hidden}
.vp .tagpin{position:absolute;font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:6px;background:rgba(12,15,17,.9);border:1px solid var(--line-2)}
.vp .ob{position:absolute;border-radius:4px}
.note{color:var(--tx-2);font-size:12.5px;margin-top:10px}
.copilot{width:330px;flex:0 0 auto;background:linear-gradient(180deg,#10161a,#0d1215);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.copilot.collapsed{width:50px}
.cphead{display:flex;align-items:center;gap:9px;padding:13px 14px;border-bottom:1px solid var(--line)}
.cphead .ai{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--violet),#6f5ef0);display:grid;place-items:center;flex:0 0 auto}
.cphead .ai svg{width:15px;height:15px}
.cphead .ti b{font-size:13.5px}.cphead .ti small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--tx-2)}
.cphead .rdy{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--green);padding:3px 7px;border-radius:6px;background:var(--green-soft)}
.cphead .col{margin-left:auto;cursor:pointer;color:var(--tx-2);background:var(--bg-2);border:1px solid var(--line);border-radius:8px;width:26px;height:26px;display:grid;place-items:center}
.copilot.collapsed .cpbody,.copilot.collapsed .cphead .ti,.copilot.collapsed .cphead .rdy,.copilot.collapsed .cpfoot{display:none}
.cpbody{flex:1;overflow-y:auto;padding:14px}
.sugg-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx-2);margin:4px 0 9px;text-transform:uppercase}
.sugg{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.14s;font-size:13px;color:var(--tx-1)}
.sugg:hover{border-color:var(--green);background:var(--green-soft);color:var(--tx-0)}
.sugg .ar{color:var(--green);font-family:var(--mono)}
.msg{margin:14px 0}
.msg .role{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx-2);margin-bottom:5px}
.msg.you .bub{background:var(--bg-3);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:13.5px}
.msg.ai .bub{font-size:13.5px;color:var(--tx-1)}
.toolcall{border:1px solid var(--line);border-radius:10px;margin:9px 0;overflow:hidden;background:var(--bg-1)}
.toolcall .th{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-2);font-family:var(--mono);font-size:11px}
.toolcall .th .nm{color:var(--cyan)}.toolcall .th .ms{margin-left:auto;color:var(--tx-3);font-size:10px}
.toolcall .tb{padding:9px 11px;font-family:var(--mono);font-size:11px;color:var(--tx-1);line-height:1.7}
.toolcall .tb .ok{color:var(--green)}.toolcall .tb .hl{color:var(--amber)}.toolcall .tb .bad{color:var(--red)}
.cpfoot{padding:11px 13px;border-top:1px solid var(--line)}
.cpinput{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:7px 9px}
.cpinput input{flex:1;background:transparent;border:0;outline:0;color:var(--tx-0);font-size:13.5px;font-family:var(--sans)}
.cpinput .snd{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--green-d));display:grid;place-items:center;cursor:pointer;color:#0b0f06}
.cpfoot .hintf{font-family:var(--mono);font-size:9px;color:var(--tx-3);margin-top:7px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg-1);margin-bottom:18px}
.legend .lh{font-family:var(--mono);font-size:10px;color:var(--tx-2);letter-spacing:.1em}
.typing{display:inline-flex;gap:3px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--tx-2);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

let CUR="home";
const ws=document.getElementById("workspace");
const sb=document.getElementById("sidebar");

function buildNav(){
  sb.innerHTML=NAV.map(g=>(
   '<div class="navgroup"><div class="navhead"><span class="gl">'+g.group+'</span>'+(g.sub?'<span class="gs">'+g.sub+'</span>':'')+'</div>'+
   g.items.map(it=>(
     '<div class="nav" data-id="'+it.id+'"><span class="code">'+it.code+'</span><span class="t">'+it.t+'</span>'+
     (it.badge?'<span class="bdg '+(it.bk||'')+'">'+it.badge+'</span>':'')+'</div>'
   )).join('')+'</div>'
  )).join('');
  sb.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.id));
}
function setActive(){sb.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.id===CUR));}
function go(id){CUR=id;setActive();const fn=PAGES[id]||(()=>genericApp(id));ws.innerHTML='<div class="fade">'+fn()+'</div>';bindPage(id);buildCopilot(id);ws.scrollTop=0;}

function provBadge(p){const m={built:["built","已實作"],art:["art","實測 artifact"],demo:["demo","示範資料"],todo:["todo","後端待建"]};const x=m[p]||m.todo;return '<span class="prov '+x[0]+'">'+x[1]+'</span>';}
function legend(){return '<div class="legend"><span class="lh">可信度標記</span>'+['built','art','demo','todo'].map(provBadge).join('')+'<span class="note" style="margin:0">每個畫面都標清楚：哪些已經能用、哪些還是示範，不對客戶過度承諾。</span></div>';}
function chips(a){return '<div class="chips">'+
  '<span class="chip '+a.cls+'">'+(a.cls==='omni'?'OMNIVERSE':a.cls==='core'?'CORE PLATFORM':'HYBRID')+'</span>'+
  '<span class="chip '+a.pri+'">'+a.pri.toUpperCase()+'</span>'+
  '<span class="chip">'+a.phase+'</span>'+
  '<span class="chip">'+a.en+'</span></div>';}

function genericApp(id){
  const a=APPS[id]; if(!a) return '<div class="wrap"><h2>頁面開發中</h2></div>';
  const ui=(UIMAP[id]||[]).map(r=>'<div class="uirow"><div class="where">'+r[0]+'</div><div class="desc">'+r[1]+'</div></div>').join('');
  return '<div class="wrap">'+
   '<div class="crumbs"><span>AI · BIM Governance</span> / <b>'+a.code+' '+a.title+'</b></div>'+
   '<div class="phead"><div><div class="big">'+a.title+'</div><div class="sub">'+a.one+'</div></div></div>'+
   chips(a)+
   '<div class="callout"><div class="ic">?</div><div><div class="tt">這頁在幫你做什麼</div><div class="dd">'+a.why+'</div></div></div>'+
   mockFor(id,a)+
   '<div class="section-t"><span class="bar"></span><h3>這個功能怎麼在介面上呈現</h3><span class="hint">UI placement</span></div>'+
   '<div class="uianalysis">'+ui+'</div>'+

function instTick(){
  if(!document.getElementById('instDyn')){if(INST_TIMER)clearInterval(INST_TIMER);INST_TIMER=null;return;}
  if(INST.moving){INST.moving.pg=Math.min(100,INST.moving.pg+14);
    if(INST.moving.pg>=100){const to=INST.nodes.find(n=>n.id===INST.moving.to);if(to)to.session=INST.moving.payload;if(INST.moving.kind==='sched')INST.pending=INST.pending.filter(p=>p.pid!==INST.moving.pid);INST.toast=INST.moving.payload.sid+' 已在 '+INST.moving.to+' 重啟完成（stage 重載完成）';INST.moving=null;clearInterval(INST_TIMER);INST_TIMER=null;}}
  else{if(INST_TIMER)clearInterval(INST_TIMER);INST_TIMER=null;}
  paintInst();
}
function initInst(){if(INST_TIMER)clearInterval(INST_TIMER);INST_TIMER=null;INST.drag=null;INST.confirm=null;INST.moving=null;INST.toast='';paintInst();}

function buildCopilot(id){
  const cfg=COPILOT[id]||COPILOT.default;
  const body=document.getElementById('cpbody');
  let h='<div class="sugg-h">建議指令 · 跟這頁有關</div>';
  h+=cfg.prompts.map(p=>'<div class="sugg" data-p="'+encodeURIComponent(p)+'"><span class="ar">›</span><span>'+p+'</span></div>').join('');
  if(cfg.demo){h+=renderDemo(cfg.demo);}
  else{h+='<div class="msg ai" style="margin-top:18px"><div class="role">AGENT</div><div class="bub">點上面任一個建議，或在下面用白話問我。我會在這頁幫你查模型、開 Issue、整理報告 — 過程都會顯示我呼叫了哪些工具，看得到才放心。</div></div>';}
  body.innerHTML=h;
  body.querySelectorAll('.sugg').forEach(s=>s.onclick=()=>runPrompt(decodeURIComponent(s.dataset.p)));
}
function renderDemo(d){
  return '<div class="msg you"><div class="role">YOU</div><div class="bub">'+d.you+'</div></div>'+
   '<div class="msg ai"><div class="role">AGENT · 解析中…</div>'+
   d.tools.map(t=>'<div class="toolcall"><div class="th"><span class="dot g"></span><span class="nm">'+t.nm+'</span><span class="ms">'+t.ms+'</span></div><div class="tb">'+t.body+'</div></div>').join('')+
   '<div class="bub" style="margin-top:8px">'+d.concl+'</div></div>';
}
function runPrompt(text){
  const body=document.getElementById('cpbody');
  const you='<div class="msg you"><div class="role">YOU</div><div class="bub">'+text+'</div></div>';
  const typing='<div class="msg ai" id="typing"><div class="role">AGENT</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>';
  body.insertAdjacentHTML('beforeend',you+typing);
  body.scrollTop=body.scrollHeight;
  setTimeout(()=>{
    const t=document.getElementById('typing');
    let reply='收到。我會在這頁的資料範圍內處理，並把每一步的工具呼叫攤開給你看。需要我實際執行（例如建立 Issue）時，會先請你確認再動作。';
    if(/issue|建立|高亮|FireRating|防火/.test(text)) reply='我先用 <span class="mono" style="color:var(--cyan)">kit_mcp.search_prims</span> 找到符合的構件，再用 <span class="mono" style="color:var(--cyan)">qa_engine.rule_lookup</span> 對規則。找到 37 個目標，建議批次建立 Critical Issue 指派給 Architect。<b>要我現在建立嗎？</b>（這步會請你確認）';
    if(/成本|改了什麼|v07|差異/.test(text)) reply='比對 v06 與 v07：新增 12、修改 31、刪除 4。會影響成本的主要是 B1 新增 12 支消防管與 4F 帷幕牆改規格。要我做成一頁給業主的摘要嗎？';
    if(t) t.outerHTML='<div class="msg ai"><div class="role">AGENT</div><div class="bub">'+reply+'</div></div>';
    body.scrollTop=body.scrollHeight;
  },900);
}

function bindPage(id){
  ws.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>go(el.dataset.jump));
  if(id==='a1') initA1();
  if(id==='conv') initConv();
  if(id==='sessions') initSessions();
  if(id==='instances') initInst();
}
function initA1(){
  let cur=0;
  const stage=document.getElementById('a1stage');
  const steps=[].slice.call(document.querySelectorAll('#stp .step'));
  function paint(){
    steps.forEach((s,i)=>{s.classList.toggle('done',i<cur);s.classList.toggle('cur',i===cur);});
    stage.innerHTML=A1STAGES[cur]();
    wire();
  }
  function wire(){
    const pick=document.getElementById('pick'); const dz=document.getElementById('dz');
    if(pick) pick.onclick=dz.onclick=()=>{ dz.innerHTML='<div class="filechip"><span class="dot g"></span><b class="mono">DD_ARC_v07.ifc</b><span class="note" style="margin:0">· 142 MB · 已上傳</span></div><div style="margin-top:14px"><span class="btn primary lg" id="startChk">開始自動檢核 →</span></div>'; document.getElementById('startChk').onclick=()=>{cur=1;paint();}; };
    if(cur===1) runCheck();
    const toIssue=document.getElementById('toIssue'); if(toIssue) toIssue.onclick=()=>{cur=3;paint();};
    const hl=document.getElementById('hl3d'); if(hl) hl.onclick=()=>{hl.innerHTML='<span class="mono">◉</span> 已在 GPU 審查室高亮 12 個構件';hl.classList.add('primary');};
    const mk=document.getElementById('mkIssue'); if(mk) mk.onclick=()=>{cur=4;paint();};
    const ai=document.getElementById('askAI'); if(ai) ai.onclick=()=>{document.getElementById('cpin').value='把這 25 個失敗構件依嚴重度分類並建立 Issue';runPrompt('把這 25 個失敗構件依嚴重度分類並建立 Issue');};
    const dl=document.getElementById('dlBcf'); if(dl) dl.onclick=()=>{dl.textContent='✓ 已下載 governance_v07.bcfzip';};
    const ag=document.getElementById('again'); if(ag) ag.onclick=()=>{cur=0;paint();};
  }
  function runCheck(){
    const bar=document.getElementById('pbar'); const log=document.getElementById('runlog');
    const lines=[['載入 IFC · 12,481 構件','ok'],['命名規則 NAMING-STD-01','ok'],['樓層 / 空間 SPACE-CODE-02','ok'],['分類碼 CLASS-UNI-03 · 22 缺漏','bad'],['防火門 ARC-DOOR-REQ-001 · 12 缺漏','bad'],['LOD / LOI · 3 不足','bad'],['產生 BCF 草稿','ok']];
    let i=0;(function tick(){ if(!bar) return; bar.style.width=Math.round((i+1)/lines.length*100)+'%';
      if(i<lines.length){const l=lines[i];log.insertAdjacentHTML('beforeend','<div class="runline"><span class="'+(l[1]==='ok'?'ok':'bad')+'">'+(l[1]==='ok'?'✓':'✕')+'</span> '+l[0]+'</div>');i++;setTimeout(tick,360);}
      else{setTimeout(()=>{cur=2;paint();},500);} })();
  }
  steps.forEach(s=>s.onclick=()=>{cur=+s.dataset.s;paint();});
  paint();
}

document.getElementById('cpcol').onclick=function(){document.getElementById('copilot').classList.toggle('collapsed');this.textContent=document.getElementById('copilot').classList.contains('collapsed')?'«':'»';};
document.getElementById('cpsend').onclick=()=>{const i=document.getElementById('cpin');if(i.value.trim()){runPrompt(i.value.trim());i.value='';}};
document.getElementById('cpin').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){runPrompt(e.target.value.trim());e.target.value='';}});

buildNav();go('home');
</script>

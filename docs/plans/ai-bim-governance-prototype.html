<!-- ════════════════════════════════════════════════════════════════════
     lib — i18n + persist (mirrors design system lib/i18n.js + lib/persist.js).
     雙語 {zh,en} · zh-Hant 主、en 副;localStorage prefix aibim:(cache 非 source of truth)。
     ════════════════════════════════════════════════════════════════════ -->
<script>
window.AIBIM = window.AIBIM || {};
(function (NS) {
  var PREFIX = "aibim:";
  NS.loadPersist = function (key, fb) {
    try { var v = localStorage.getItem(PREFIX + key); return v == null ? fb : JSON.parse(v); }
    catch (e) { return fb; }
  };
  NS.savePersist = function (key, val) {
    try { localStorage.setItem(PREFIX + key, JSON.stringify(val)); } catch (e) {}
  };
  NS.usePersistentState = function (key, fb) {
    var R = window.React;
    var pair = R.useState(function () { return NS.loadPersist(key, fb); });
    var v = pair[0], setV = pair[1];
    R.useEffect(function () { NS.savePersist(key, v); }, [v]);
    return [v, setV];
  };
  NS.tt = function (node, lang) {
    if (node && typeof node === "object" && ("zh" in node || "en" in node)) {
      return node[lang] != null ? node[lang] : (node.zh != null ? node.zh : node.en);
    }
    return node;
  };
  NS.useLang = function (def) { return NS.usePersistentState("lang", def || "zh"); };
  NS.STR = {
    project:{ zh:"專案", en:"PROJECT" }, version:{ zh:"版本", en:"VERSION" }, phase:{ zh:"階段", en:"PHASE" },
    submitting:{ zh:"送審中", en:"IN REVIEW" },
  };
})(window.AIBIM);
</script>

<!-- ════════════════════════════════════════════════════════════════════
     Design-system component primitives (13 元件, sharedSheet §6) —
     reimplemented as vanilla React.createElement factories so this file is
     standalone (the real kit loads window.AIBIMGovernanceDesignSystem_*).
     ════════════════════════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState } = React;

/* ── ProvTag (誠實簽名) — 5 類:built / artifact / demo / ai / todo ── */
const PROV = {
  built:    { c:"var(--prov-built)",    bg:"var(--prov-built-bg)",    label:"已實作 · AS-BUILT",  dash:false },
  artifact: { c:"var(--prov-artifact)", bg:"var(--prov-artifact-bg)", label:"實測 · ARTIFACT",    dash:false },
  demo:     { c:"var(--prov-demo)",     bg:"var(--prov-demo-bg)",     label:"示範資料 · DEMO",    dash:true  },
  ai:       { c:"var(--prov-ai)",       bg:"var(--prov-ai-bg)",       label:"AI · P1.5",          dash:false },
  todo:     { c:"var(--prov-todo)",     bg:"var(--prov-todo-bg)",     label:"後端待建 · NOT BUILT", dash:true },
};
function ProvTag({ level, note }) {
  const p = PROV[level] || PROV.todo;
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:6, fontFamily:"var(--font-mono)",
      fontSize:10, letterSpacing:".06em", color:p.c, background:p.bg,
      border:(p.dash ? "1px dashed " : "1px solid ") + p.c, padding:"2px 8px", borderRadius:"var(--radius-xs)" }}>
      <i style={{ width:6, height:6, borderRadius:"50%", background:p.c }} />
      {note || p.label}
    </span>
  );
}

/* ── StatusLED — idle 無 glow,.pulse = live ── */
function StatusLED({ tone="ok", pulse }) {
  const c = { ok:"var(--ok)", warn:"var(--warn)", err:"var(--err)", ai:"var(--ai)", idle:"var(--idle)" }[tone];
  return <i style={{ width:8, height:8, borderRadius:"50%", background:c, flex:"0 0 auto",
    boxShadow: tone === "idle" ? "none" : `0 0 7px ${c}`,
    animation: pulse && tone !== "idle" ? "ec-fade 1.4s var(--ease) infinite alternate" : "none" }} />;
}

/* ── Pill (crumb) ── */
function Pill({ label, value, caret }) {
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:7, background:"var(--surface-2)",
      border:"1px solid var(--line)", borderRadius:"var(--radius-pill)", padding:"4px 11px", fontSize:12 }}>
      <span style={{ fontFamily:"var(--font-mono)", fontSize:9.5, letterSpacing:".1em", color:"var(--text-3)", textTransform:"uppercase" }}>{label}</span>
      <b style={{ color:"var(--text)", fontWeight:600 }}>{value}</b>
      {caret ? <span style={{ color:"var(--text-4)", fontSize:9 }}>▾</span> : null}
    </span>
  );
}

/* ── Badge ── */
function Badge({ tone="neutral", children }) {
  const map = {
    neutral:{ c:"var(--text-2)", b:"var(--line-2)", bg:"var(--surface-2)" },
    accent: { c:"var(--accent)", b:"var(--c-green-ring)", bg:"var(--c-green-dim)" },
    info:   { c:"var(--info)", b:"var(--info)", bg:"var(--info-soft)" },
    warn:   { c:"var(--warn)", b:"var(--warn)", bg:"var(--warn-soft)" },
    err:    { c:"var(--err)", b:"var(--err)", bg:"var(--err-soft)" },
    ai:     { c:"var(--ai)", b:"var(--ai)", bg:"var(--ai-soft)" },
  }[tone] || {};
  return <span style={{ fontFamily:"var(--font-mono)", fontSize:10, fontWeight:600, color:map.c,
    background:map.bg, border:`1px solid ${map.b}`, padding:"2px 7px", borderRadius:"var(--radius-xs)",
    letterSpacing:".04em" }}>{children}</span>;
}

/* ── Button (primary / ghost; disabled 標 prov) ── */
function Button({ variant="ghost", size="md", disabled, prov, children, onClick }) {
  const pad = size === "sm" ? "7px 12px" : "9px 15px";
  const fs = size === "sm" ? 12.5 : 13.5;

          {tt({ zh:"每個畫面與按鈕都標清楚可信度:已實作、實測、示範資料、AI、後端待建。不放願景假數字 —— 沒有遙測就標「未取得」,不畫成綠燈。", en:"Every screen and button is labeled: as-built, artifact, demo, AI, not-built. No vanity numbers — missing telemetry reads 未取得, never fake green." }, lang)}
        </div>
      </D.Card>
    </div>
  );
}

    tree:[

/* A1 連動橋證據(單一來源=#sessions;此處唯讀鏡射,不推定) */
const A1_BRIDGE = [
  { k:{ zh:"session 派發", en:"session" },      v:"sess_8f21 · ACTIVE", tone:"ok" },
  { k:{ zh:"WebRTC 首幀", en:"first frame" },   v:{ zh:"未取得", en:"not seen" }, tone:"idle" },
  { k:{ zh:"DataChannel", en:"DataChannel" },   v:{ zh:"未取得", en:"not ready" }, tone:"idle" },
  { k:{ zh:"stage matched", en:"stage match" }, v:{ zh:"未取得", en:"unverified" }, tone:"idle" },
];

function A1Page({ lang }) {
  const [src, setSrc] = useState("local");          // 雙來源切換
  const [pick, setPick] = useState("dd");           // 原型審查:選檔樣式 dd|cascade|tree
  const [selP, setSelP] = useState(null);           // 專案
  const [selK, setSelK] = useState(null);           // 種類
  const [selF, setSelF] = useState(null);           // 版本檔
  const [stage, setStage] = useState("idle");       // idle→picked→running→scored→issued→delivered
  const [prog, setProg] = useState(0);
  const [confirming, setConfirming] = useState(false);
  const [topics, setTopics] = useState([]);

  const S = A1_SOURCES[src];
  const proj = S.tree.find(x => x.p === selP) || null;
  const kind = proj ? (proj.kinds.find(x => x.k === selK) || null) : null;
  const file = kind ? (kind.files.find(x => x.n === selF) || null) : null;
  const path = file ? `${selP}/${selK}/${selF}` : null;

  const resetTo = (st) => { setStage(st); setConfirming(false); if (st === "idle") { setSelP(null); setSelK(null); setSelF(null); setTopics([]); setProg(0); } };
  const switchSrc = (k) => { setSrc(k); resetTo("idle"); };
  const choose = (p, k, f) => { setSelP(p); setSelK(k); setSelF(f); setStage(f ? "picked" : "idle"); setTopics([]); setProg(0); };

  const runCheck = () => {
    setStage("running"); setProg(0);
    const t = setInterval(() => setProg(p => {
      if (p >= 100) { clearInterval(t); setStage("scored"); return 100; }
      return p + 20;
    }), 300);
  };
  const createIssues = () => {
    setConfirming(false); setStage("issued");
    setTopics([
      { id:"TP-01", rule:"IDS-FR-02", t:{ zh:"防火時效未填 × 12 構件", en:"Fire rating missing × 12" }, sev:"HIGH", st:"open",        who:null },
      { id:"TP-02", rule:"IDS-ST-01", t:{ zh:"樓層歸屬缺漏 × 9 構件", en:"Storey missing × 9" },        sev:"MED",  st:"open",        who:null },
      { id:"TP-03", rule:"IDS-LOD-04", t:{ zh:"LOD/LOI 不足 × 4 構件", en:"LOD/LOI below spec × 4" },   sev:"MED",  st:"in-progress", who:null },
    ]);
  };
  const cycleSt = (i) => setTopics(ts => ts.map((tp, j) => j !== i ? tp : ({ ...tp, st: tp.st === "open" ? "in-progress" : tp.st === "in-progress" ? "resolved" : "open" })));

  const rules = [
    { name:{ zh:"命名規範 · Naming", en:"Naming" }, code:"IDS-NM-01", tone:"ok", sev:"—" },
    { name:{ zh:"分類碼 · Classification", en:"Classification" }, code:"IDS-CL-03", tone:"ok", sev:"—" },
    { name:{ zh:"防火時效未填 · Fire rating", en:"Fire rating missing" }, code:"IDS-FR-02", tone:"err", sev:"HIGH" },
    { name:{ zh:"樓層歸屬 · Storey", en:"Storey assignment" }, code:"IDS-ST-01", tone:"warn", sev:"MED" },
    { name:{ zh:"LOD / LOI", en:"LOD / LOI" }, code:"IDS-LOD-04", tone:"warn", sev:"MED" },
  ];
  const toneDot = { ok:"var(--ok)", warn:"var(--warn)", err:"var(--err)" };
  const stepIdx = { idle:0, picked:1, running:1, scored:2, issued:3, delivered:4 }[stage];
  const scored = (stage === "scored" || stage === "issued" || stage === "delivered");
  const stMap = {
    open:          { l:"OPEN",        c:"var(--err)" },
    "in-progress": { l:"IN-PROGRESS", c:"var(--warn)" },
    resolved:      { l:"RESOLVED",    c:"var(--ok)" },
  };
  const selBtn = (on) => ({ all:"unset", cursor:"pointer", fontFamily:"var(--font-mono)", fontSize:11, padding:"5px 10px", borderRadius:6,
    color: on ? "var(--text)" : "var(--text-3)", background: on ? "var(--accent-soft)" : "var(--surface-2)",
    border: `1px solid ${on ? "var(--c-green-ring)" : "var(--line)"}` });

  /* ── 選檔區:三種樣式(原型審查用切換;正式版擇一) ── */
  const pickerDD = (
    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
      <select value={path || ""} onChange={(e) => { const [p,k,f] = e.target.value.split("/"); choose(p, k, f); }}
        style={{ background:"var(--surface-2)", color:"var(--text)", border:"1px solid var(--line-2)", borderRadius:"var(--radius-sm)", padding:"10px 12px", fontFamily:"var(--font-mono)", fontSize:13, outline:"none", width:"100%", boxSizing:"border-box" }}>
        <option value="" disabled>{tt({ zh:"— 選擇偵測到的 IFC —", en:"— pick a detected IFC —" }, lang)}</option>
        {S.tree.map(P => P.kinds.map(K => (
          <optgroup key={P.p + K.k} label={`${P.p} / ${K.k}`}>
            {K.files.map(F => <option key={F.n} value={`${P.p}/${K.k}/${F.n}`}>{`${P.p} / ${K.k} / ${F.n} · ${F.s}`}</option>)}
          </optgroup>
        )))}
      </select>
    </div>
  );
  const pickerCascade = (
    <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
      {[
        { lab:S.lv[lang][0], items:S.tree.map(P => P.p), val:selP, on:(v) => { setSelP(v); setSelK(null); setSelF(null); setStage("idle"); } },
        { lab:S.lv[lang][1], items:proj ? proj.kinds.map(K => K.k) : [], val:selK, on:(v) => { setSelK(v); setSelF(null); setStage("idle"); } },
        { lab:S.lv[lang][2], items:kind ? kind.files.map(F => F.n) : [], val:selF, on:(v) => choose(selP, selK, v) },
      ].map((row, ri) => (
        <div key={ri} style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
          <span style={{ fontFamily:"var(--font-mono)", fontSize:10, color:"var(--text-4)", letterSpacing:".06em", minWidth:64 }}>{row.lab}</span>
          {row.items.length === 0
            ? <span style={{ fontSize:11.5, color:"var(--text-4)" }}>{tt({ zh:"← 先選上一層", en:"← pick the level above" }, lang)}</span>
            : row.items.map(it => <button key={it} onClick={() => row.on(it)} style={selBtn(row.val === it)}>{it}</button>)}
        </div>
      ))}
    </div>
  );
  const pickerTree = (
    <div style={{ display:"flex", flexDirection:"column", gap:2, fontFamily:"var(--font-mono)", fontSize:12 }}>
      {S.tree.map(P => (
        <div key={P.p}>
          <div style={{ color:"var(--text-2)", padding:"4px 0" }}>▾ {P.p}</div>
          {P.kinds.map(K => (
            <div key={K.k} style={{ paddingLeft:16 }}>
              <div style={{ color:"var(--text-3)", padding:"3px 0" }}>▾ {K.k}</div>
              {K.files.map(F => {
                const on = path === `${P.p}/${K.k}/${F.n}`;
                return (
                  <button key={F.n} onClick={() => choose(P.p, K.k, F.n)}
                    style={{ all:"unset", cursor:"pointer", display:"flex", alignItems:"center", gap:8, padding:"4px 8px", marginLeft:16, borderRadius:6,
                      background: on ? "var(--accent-soft)" : "transparent", border:`1px solid ${on ? "var(--c-green-ring)" : "transparent"}` }}>
                    <span style={{ width:6, height:6, borderRadius:"50%", background: on ? "var(--accent)" : "var(--text-4)" }} />
                    <span style={{ color: on ? "var(--text)" : "var(--text-2)" }}>{F.n}</span>
                    <span style={{ color:"var(--text-4)", fontSize:10.5 }}>{F.s} · {F.t}</span>
                  </button>
                );
              })}
            </div>
          ))}
        </div>
      ))}
    </div>
  );

  return (
    <div>
      <PageHead crumb="A1 · 治理與模型檢核 [P0]" title={tt({ zh:"治理與模型檢核", en:"Governance & model check" }, lang)}
        sub={tt({ zh:"v2:從偵測到的 IFC 選檔(local_fs / MinIO 雙來源)→ rule_engine + ifctester(IDS)檢核 → BCF 審查 → 交付。記分板為示意數,非實測。", en:"v2: pick a detected IFC (local_fs / MinIO), run rule_engine + ifctester(IDS), review BCF topics, deliver. Scoreboard values are demo." }, lang)}
        prov={<D.ProvTag level="built" />} host={<HostTag kind="host" />} />

      {/* ① 選檔 · 模型來源(取代舊「上傳」) */}
      <D.Panel title={tt({ zh:"① 選檔 · 偵測到的 IFC", en:"① Pick file · detected IFC" }, lang)}
        sub={S.api}
        right={<div style={{ display:"flex", gap:8, alignItems:"center" }}>
          {Object.keys(A1_SOURCES).map(k => (
            <button key={k} onClick={() => switchSrc(k)} style={selBtn(src === k)}>{tt(A1_SOURCES[k].label, lang)}</button>
          ))}
          <D.ProvTag level={S.prov} note={src === "minio" ? "真 MinIO 逐層 · 唯讀" : "local_fs · 真接線"} />
        </div>}>
        {/* 原型審查:選檔樣式切換(非產品 UI) */}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, paddingBottom:10, borderBottom:"1px dashed var(--line-2)" }}>
          <span style={{ fontFamily:"var(--font-mono)", fontSize:9.5, letterSpacing:".08em", color:"var(--ai)", background:"var(--ai-soft)", border:"1px solid var(--ai)", padding:"2px 7px", borderRadius:5 }}>PROTO</span>
          <span style={{ fontSize:11.5, color:"var(--text-3)" }}>{tt({ zh:"選檔樣式(供挑,正式版擇一):", en:"Picker style (pick one for prod):" }, lang)}</span>
          {[["dd", { zh:"下拉", en:"Dropdown" }], ["cascade", { zh:"級聯 pills", en:"Cascade pills" }], ["tree", { zh:"樹狀", en:"Tree" }]].map(([k, l]) => (
            <button key={k} onClick={() => setPick(k)} style={selBtn(pick === k)}>{tt(l, lang)}</button>
          ))}
        </div>
        {pick === "dd" ? pickerDD : pick === "cascade" ? pickerCascade : pickerTree}
        {/* 選定檔案列 */}
        <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:12, padding:"10px 12px", borderRadius:8, background:"#070a0d", border:`1px solid ${file ? "var(--c-green-ring)" : "var(--line)"}` }}>
          <D.StatusLED tone={file ? "ok" : "idle"} />
          {file ? (
            <>
              <span style={{ flex:1, fontFamily:"var(--font-mono)", fontSize:12.5, color:"var(--text)" }}>{src === "minio" ? "bim-control/" : "storage/"}{path}</span>
              <span style={{ fontFamily:"var(--font-mono)", fontSize:11, color:"var(--text-3)" }}>{file.s} · {file.t}</span>
              <D.Badge tone="warn">{tt({ zh:"測試資料", en:"TEST DATA" }, lang)}</D.Badge>
            </>
          ) : (
            <span style={{ flex:1, fontSize:12.5, color:"var(--text-3)" }}>{tt({ zh:"目前未選檔 —— 從上方偵測結果選一個 .ifc(模式 6:不補假列)", en:"No file picked — choose a detected .ifc above (pattern 6: no fake rows)" }, lang)}</span>
          )}
          <D.Button variant="primary" size="sm" disabled={!file || stage === "running"} onClick={runCheck}>
            {stage === "running" ? tt({ zh:"檢核中…", en:"Running…" }, lang) : tt({ zh:"執行規則檢核", en:"Run rule check" }, lang)}
          </D.Button>
        </div>
        {stage === "running" ? (
          <div style={{ marginTop:10 }}>
            <div style={{ height:6, borderRadius:4, background:"var(--surface-2)", border:"1px solid var(--line)", overflow:"hidden" }}>
              <div style={{ width:prog + "%", height:"100%", background:"var(--accent)", transition:"width .25s linear" }} />
            </div>
            <div style={{ marginTop:6, fontFamily:"var(--font-mono)", fontSize:10.5, color:"var(--text-3)" }}>POST /api/governance/rule-runs → GET /api/governance/rule-runs/:id · {prog}%(1500ms 輪詢 · 示意)</div>
          </div>
        ) : null}
      </D.Panel>

      {/* 檢核流程 stepper */}
      <D.Panel title={tt({ zh:"檢核流程", en:"Check flow" }, lang)} sub="選檔 → 檢核 → 結果 → 審查(Issue·BCF) → 交付"
        right={<D.Button variant="ghost" size="sm" onClick={() => resetTo("idle")}>{tt({ zh:"重跑 · 回到選檔", en:"Restart" }, lang)}</D.Button>}>
        <D.Stepper steps={[tt({ zh:"選檔", en:"Pick" }, lang), tt({ zh:"檢核", en:"Check" }, lang), tt({ zh:"結果", en:"Score" }, lang), tt({ zh:"審查", en:"Review" }, lang), tt({ zh:"交付", en:"Deliver" }, lang)]} current={stepIdx} />
      </D.Panel>

      {/* ③ 記分板 + 規則清單(未跑完=模式 6 空狀態,不補假列) */}
      <SectionTitle hint="ifctester · IDS/YAML · 示意數">{tt({ zh:"記分板 · Scoreboard(pass/fail 色碼)", en:"Scoreboard" }, lang)}</SectionTitle>
      {scored ? (
        <>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12 }}>
            <D.MetricCard label="PASSED" value="287" unit="rules" tone="accent" note="DEMO" />
            <D.MetricCard label="BLOCKED" value="25" tone="err" note="DEMO · 需修正" />
            <D.MetricCard label="PASS RATE" value="92" unit="%" tone="info" note="DEMO" />
            <D.MetricCard label="構件 · ELEMENTS" value="4,182" tone="text" note="DEMO" />
          </div>
          <SectionTitle hint="點紅燈可開 Issue">{tt({ zh:"規則清單 · Rules", en:"Rules" }, lang)}</SectionTitle>
          <D.Panel title={tt({ zh:"檢核規則 · 對選定檔", en:"Check rules · for picked file" }, lang)} right={<D.ProvTag level="built" />}>
            <div style={{ fontFamily:"var(--font-mono)", fontSize:10.5, color:"var(--text-4)", marginBottom:8 }}>{src === "minio" ? "bim-control/" : "storage/"}{path}</div>
            <div style={{ display:"flex", flexDirection:"column" }}>
              {rules.map((r, i) => (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 0", borderBottom: i < rules.length - 1 ? "1px solid var(--line)" : "none" }}>
                  <span style={{ width:8, height:8, borderRadius:"50%", background:toneDot[r.tone], boxShadow: r.tone !== "ok" ? `0 0 6px ${toneDot[r.tone]}` : "none", flex:"0 0 auto" }} />
                  <span style={{ flex:1, fontSize:13.5, color:"var(--text)" }}>{tt(r.name, lang)}</span>
                  <span style={{ fontFamily:"var(--font-mono)", fontSize:11, color:"var(--text-3)" }}>{r.code}</span>
                  {r.sev !== "—" ? <D.Badge tone={r.tone === "err" ? "err" : "warn"}>{r.sev}</D.Badge> : <span style={{ width:46 }} />}
                </div>
              ))}
            </div>
            {confirming ? (
              <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:14, padding:"10px 12px", borderRadius:8, background:"var(--warn-soft)", border:"1px solid var(--warn)" }}>
                <span style={{ flex:1, fontSize:12.5, color:"var(--text)" }}>{tt({ zh:"將對 25 個失敗構件建 3 筆 issue(冪等鍵 rule_run_id+guid,已建過會跳過)。", en:"Creates 3 issues for 25 failing elements (idempotent by rule_run_id+guid)." }, lang)}</span>
                <D.Button variant="primary" size="sm" onClick={createIssues}>{tt({ zh:"確認執行", en:"Confirm" }, lang)}</D.Button>
                <D.Button variant="ghost" size="sm" onClick={() => setConfirming(false)}>{tt({ zh:"取消", en:"Cancel" }, lang)}</D.Button>
              </div>
            ) : (
              <div style={{ display:"flex", gap:10, marginTop:14 }}>
                <D.Button variant="primary" disabled={stage !== "scored"} onClick={() => setConfirming(true)}>{tt({ zh:"失敗構件轉 Issue(模式 3)→", en:"Failures → Issues (pattern 3) →" }, lang)}</D.Button>
              </div>
            )}
          </D.Panel>
        </>
      ) : (
        <D.Panel title={tt({ zh:"尚無檢核結果", en:"No results yet" }, lang)}>
          <div style={{ color:"var(--text-3)", fontSize:13, lineHeight:1.65 }}>
            {tt({ zh:"目前沒有這個檔的 rule-run 結果。先在上方選檔並執行規則檢核(模式 6:空狀態給下一步,不補假數)。", en:"No rule-run for this file yet. Pick a file above and run the check (pattern 6: empty state with next step, no fake numbers)." }, lang)}
          </div>
        </D.Panel>
      )}

      {/* ④ BCF 審查面板(新) */}
      <SectionTitle hint="issues API · BCF 2.1 匯出">{tt({ zh:"BCF 審查 · Topics(對選定檔)", en:"BCF review · Topics (picked file)" }, lang)}</SectionTitle>
      <D.Panel title={tt({ zh:"BCF Topic 審查面板", en:"BCF topic review" }, lang)}
        right={<D.ProvTag level={topics.length ? "built" : "demo"} note={tt({ zh:"列表/狀態=issues API;指派=待建", en:"list/status = issues API; assign pending" }, lang)} />}>
        {topics.length === 0 ? (
          <div style={{ color:"var(--text-3)", fontSize:13, lineHeight:1.65 }}>
            {tt({ zh:"目前沒有 topic。檢核出結果後,由「失敗構件轉 Issue」產生(Issue 共同出海口:A1/A2/A3/A5 共用 schema)。", en:"No topics yet. They are created from failing rules via Failures → Issues (shared Issue/BCF schema)." }, lang)}
          </div>
        ) : (
          <>
            <div style={{ display:"flex", flexDirection:"column" }}>

  const isClosed = (id) => closed.indexOf(id) !== -1;

    <span style={{ display:"inline-flex", alignItems:"center", gap:6, fontFamily:"var(--font-mono)", fontSize:10.5 }}>

   review 須保留各自獨立 case,不可重定向到 #gpu(否則斷 deep link;見 對齊矩陣 §2 M2 / §5-L8、
   開發軌跡 §8 D9、實作紀律 §5 / §13-I5)。 */
window.EC_ALIAS = {

<!-- ════════════════════════════════════════════════════════════════════
     SHELL — three-column Edge Console.
     hash 路由(go(id) → location.hash · 22 條無斜線);refresh 不丟狀態
     (active page + lang + agentOpen 持久化於 localStorage aibim:*)。
     ════════════════════════════════════════════════════════════════════ -->
<script type="text/babel">
const { useEffect: useFx } = React;
const SH = window.DS;

function readHash() {
  const h = (location.hash || "").replace(/^#\/?/, "").trim();
  if (!h) return null;
  return window.EC_ALIAS[h] || h;
}

function EdgeConsole() {
  const tF = (n) => window.AIBIM.tt(n, lang);
  const [lang, setLang] = window.AIBIM.useLang();
  const [active, setActive] = window.AIBIM.usePersistentState("ec:active", "a1");
  const [agentOpen, setAgentOpen] = window.AIBIM.usePersistentState("ec:agentOpen", true);

  const allItems = window.EC_NAV.flatMap((g) => g.items);
  const item = allItems.find((i) => i.id === active) || allItems[0];

  // hash ↔ active sync (hash 無斜線;支援別名)
  useFx(() => {
    const fromHash = readHash();
    if (fromHash && allItems.some((i) => i.id === fromHash) && fromHash !== active) setActive(fromHash);
    const onHash = () => {
      const h = readHash();
      if (h && allItems.some((i) => i.id === h)) setActive(h);
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  const go = (id) => { setActive(id); if (("#" + id) !== location.hash) location.hash = "#" + id; };

  return (
    <div className="ec-root" data-agent={agentOpen ? "on" : "off"}>
      {/* ── TOP ── */}
      <div className="ec-top">
        <div className="brand">
          <div className="brand-mark">BG</div>
          <div>
            <div className="brand-name">AI · BIM Governance</div>
            <div className="brand-sub">EDGE RUNTIME · 殼層需求原型</div>
          </div>
        </div>
        {/* tenant 徽章(示意)· 多租戶 SaaS 全部 PLANNED · 詳見 saas-架構總覽 */}
        <span title="多租戶 SaaS PLANNED · 詳見 ai-bim-governance-saas-架構總覽.md"
          style={{ display:"inline-flex", alignItems:"center", gap:7, fontFamily:"var(--font-mono)", fontSize:10,
            letterSpacing:".04em", background:"var(--surface-2)", border:"1px dashed var(--line-2)", padding:"3px 9px", borderRadius:"var(--radius-pill)" }}>
          <span style={{ color:"var(--text-2)", fontWeight:600 }}>tenant zero · 單站點現況</span>
          <span style={{ color:"var(--warn)", background:"var(--warn-soft)", border:"1px solid var(--warn)", padding:"0 5px", borderRadius:3, fontSize:8.5, letterSpacing:".08em" }}>DEMO DATA</span>
        </span>
        <div className="ec-crumbs">
          <SH.Pill label={tF(window.AIBIM.STR.project)} value="270 · 測試 IFC" caret />
          <SH.Pill label={tF(window.AIBIM.STR.version)} value="v07" caret />
          <SH.Pill label={tF(window.AIBIM.STR.phase)} value={tF(window.AIBIM.STR.submitting)} />
        </div>
        <div style={{ flex:1 }} />
        <div style={{ display:"flex", alignItems:"center", paddingRight:10 }}><SH.LangToggle value={lang} onChange={setLang} /></div>
        <div className="ec-health-top">
          {window.EC_HEALTH.map((h) => <SH.HealthChip key={h.k} k={h.k} value={h.value} tone={h.tone} />)}
        </div>
        <div className="ec-user"><span className="av">陳</span></div>
      </div>

      {/* ── NAV ── */}
      <nav className="ec-nav">
        {window.EC_NAV.map((g, gi) => (
          <div key={gi} className={"ec-nav-section" + (g.plane === "omni" ? " omni" : "")}>
            <div className="ec-nav-section-h">
              <span className="dot" style={{ background: g.dot === "ok" ? "var(--accent)" : "var(--idle)", boxShadow: g.dot === "ok" ? "0 0 6px var(--accent-ring)" : "none" }} />
              {tF(g.group)}
              {g.sub ? <span className="ec-nav-section-k">{g.sub}</span> : null}
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:1 }}>
              {g.items.map((it) => (
                <SH.NavItem key={it.id} code={it.code} label={tF(it.label)} badge={it.badge} badgeTone={it.badgeTone}
                  plane={it.plane} active={active === it.id} onClick={() => go(it.id)} />
              ))}
            </div>
          </div>
        ))}
        <div className="ec-nav-boundary">
          雲地邊界 · Governance host-native (0 GPU) ↔ Omniverse Runtime (GPU)
          {/* 雲端控制面尚未建置 · 灰色不偽綠 */}
          <div style={{ marginTop:7 }}>
            <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:".06em", color:"var(--text-3)",
              background:"var(--surface-2)", border:"1px dashed var(--line-2)", padding:"2px 7px", borderRadius:4 }}>雲端控制面:PLANNED · 未建</span>
          </div>
        </div>
      </nav>

      {/* ── MAIN ── */}
      <main className="ec-main">
        <div className="ec-scroller" key={active}>
          {window.EC_PAGES(active, { item, lang })}
        </div>
      </main>

      {/* ── AGENT RAIL ── */}
      {agentOpen ? (
        <aside className="ec-agent">
          <div className="ec-agent-head">
            <span className="ico">✦</span>
            <span className="lab"><b>Chat USD Agent</b><br />kit-mcp · usd-code-mcp · omni-ui-mcp</span>
            <span className="pill-rdy">READY</span>
            <button className="x" onClick={() => setAgentOpen(false)}>×</button>
          </div>
          <div className="ec-agent-body">
            <div className="ec-agent-note">AI 只在 session layer 操作 · 不直接改 source model</div>
            <div style={{ fontFamily:"var(--font-mono)", fontSize:9.5, letterSpacing:".14em", color:"var(--text-4)", textTransform:"uppercase" }}>TOOL CALLS · 本次查詢軌跡(示意)</div>
            {window.EC_TOOLCALLS.map((t, i) => (
              <SH.ChatToolCall key={i} tool={t.tool} ms={t.ms} status={t.status} result={t.result} />
            ))}
          </div>
          <div className="ec-input">
            <div className="box">
              <span className="gt">&gt;</span>
              <input placeholder="用白話問模型,例如:v07 改了什麼?" />
            </div>
          </div>
        </aside>
      ) : null}

      {/* ── FOOT (job bar) ── */}
      <div className="ec-foot">
        <div className="job">
          <span className="src omni">OMNI</span>
          <span className="name">轉檔 270/機電/000001.ifc → USD(示意)</span>
          <span className="pg"><i /></span>
          <span className="val">62%</span>
        </div>
        <div style={{ flex:1 }} />
        <span>coordinator :8004 · governance :49102 · MCP 3/3</span>
        {!agentOpen ? <button className="foot-btn" onClick={() => setAgentOpen(true)}>↗ Chat USD Agent</button> : null}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<EdgeConsole />);
</script>
</body>
</html>

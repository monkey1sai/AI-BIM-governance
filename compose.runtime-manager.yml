name: ${COMPOSE_PROJECT_NAME:-ai-bim-runtime-manager}

services:
  # B-scheme（local-coordinator-ifc-ready-intake-boundary T2）：
  # `_worker`(:8005) 與 `_bim-control`(:8001) 已自 repo 刪除。外部公司雲端
  # control-plane 與落地端 IFC Worker 屬外部系統，僅由 tests/fakes 模擬；
  # 對外 intake 收斂於 coordinator（T3），streaming 為 internal-only（T4）。
  coordinator:
    build:
      context: .
      dockerfile: infra/docker/coordinator-web-plane.Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      HOST: 0.0.0.0
      PORT: 8004
      # B-scheme T2：legacy mock service API bases 已移除（兩 mock 服務刪除）。
      # 對外 IFC-ready intake / 公司雲端 callback 設定由 T3/T5 引入；coordinator
      # 不再 depends_on 已刪服務，獨立啟動。
      STREAMING_CONVERSION_API_BASE: http://streaming-server:49101
      CONVERSION_API_BASE: http://streaming-server:49101
      KIT_MANAGER_API_BASE: http://kit-manager-api:8010
      DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-dev-token}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}"
      INTERNAL_API_AUTH_TOKEN: ${INTERNAL_API_AUTH_TOKEN:-dev-internal-token}
      CALLBACK_OUTBOX_STORE_PATH: /workspace/storage/coordinator/callback-outbox.json
      KIT_INSTANCE_ENDPOINTS: '[{"id":"kit_local_gpu_001","signalingServer":"127.0.0.1","signalingPort":49100,"mediaServer":"127.0.0.1","mediaPort":47998}]'
      # fast-ifc-link-demo-loop §2:同步下載 IFC 寫入 shared volume。
      # STORAGE_ROOT 必須對齊下方 volumes mount destination(/workspace/storage);
      # 否則 coordinator 走 config.ts default `<cwd>/storage`,IFC 會寫到 container
      # local fs(/workspace/bim-review-coordinator/storage),不會落到 host shared
      # volume,host-native streaming-server 取不到。
      STORAGE_ROOT: /workspace/storage
      # STORAGE_HOST_ROOT:寫進 dispatch payload `host_local_path` 供 streaming-server
      # 從 host fs 直接讀(streaming-server 為 host-native,看的是 host path)。
      # 預設與 volumes mount source 同源,user 若要對 host-native streaming-server 用
      # 應在 .env 設 RUNTIME_STORAGE_ROOT 為 host absolute path
      # (例:RUNTIME_STORAGE_ROOT=C:\Repos\active\iot\AI-BIM-governance\storage)。
      STORAGE_HOST_ROOT: ${RUNTIME_STORAGE_ROOT:-./storage}
      # IFC_DOWNLOAD_STRICT:控制 HTTP 取 IFC 失敗時的行為。
      # false(此 dev default):fetch 失敗時 fallback 寫 placeholder,demo loop 不中斷。
      # production MUST 設 "true":strict 下 HTTP 拿不到 IFC(non-2xx)直接回 502 +
      # download_status=failed,不靜默產 placeholder,避免假資料流入下游 conversion。
      IFC_DOWNLOAD_STRICT: "${IFC_DOWNLOAD_STRICT:-false}"
      # CH-E:React UnifiedConsole build(vite base=/ui/) 由 coordinator image 內建。
      # 不依賴 host ignored artifact `web-viewer-sample/dist-ui`;否則測試部署 git clean 後會回退 dev-console。
      CONSOLE_DIST_DIR: /workspace/console-dist
      # minio-watch-auto-intake（O4）：dockerized coordinator 的 MinIO watcher 設定透傳。
      # 缺此透傳則 dockerized coordinator 無管道收到 MINIO_WATCH_*（.env 不掛入容器、image 不烤 .env），
      # PUT /api/conversion/watch 永遠走 minioWatchConfigured()=false → 422，功能在 docker 部署無法啟用。
      # 未設時 `${VAR:-}` 解析為空字串，config.ts 視同未啟用（parseBooleanEnv→false、endpoint/bucket/creds 空
      # → minioWatchConfigured()=false；interval/suffix/tenant 等空值回退既有預設），與無此功能完全一致（spec：env opt-in 預設關）。
      # 真值由部署區 .env 提供：S3 credentials 唯讀且不入 tracked 檔（spec「S3 credentials SHALL 僅由 env 提供」；
      # P7 部署驗證見 docs/evidence/minio-watch-auto-intake/README.md）。
      MINIO_WATCH_ENABLED: ${MINIO_WATCH_ENABLED:-}
      MINIO_WATCH_ENDPOINT: ${MINIO_WATCH_ENDPOINT:-}
      MINIO_WATCH_BUCKET: ${MINIO_WATCH_BUCKET:-}
      MINIO_WATCH_PREFIX: ${MINIO_WATCH_PREFIX:-}
      MINIO_WATCH_ACCESS_KEY: ${MINIO_WATCH_ACCESS_KEY:-}
      MINIO_WATCH_SECRET_KEY: ${MINIO_WATCH_SECRET_KEY:-}
      MINIO_WATCH_INTERVAL_SECONDS: ${MINIO_WATCH_INTERVAL_SECONDS:-}
      MINIO_WATCH_INTERVAL_FLOOR_SECONDS: ${MINIO_WATCH_INTERVAL_FLOOR_SECONDS:-}
      MINIO_WATCH_KEY_SUFFIX: ${MINIO_WATCH_KEY_SUFFIX:-}
      MINIO_WATCH_TENANT_ID: ${MINIO_WATCH_TENANT_ID:-}
      MINIO_WATCH_SELF_BASE_URL: ${MINIO_WATCH_SELF_BASE_URL:-}
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ${RUNTIME_STORAGE_ROOT:-./storage}:/workspace/storage
    depends_on:
      kit-manager-api:
        condition: service_healthy

  viewer:
    build:
      context: .
      dockerfile: infra/docker/web-viewer-sample.Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_COORDINATOR_API_BASE: http://127.0.0.1:8004
      VITE_KIT_STREAM_SERVER: 127.0.0.1
      VITE_KIT_SIGNALING_PORT: ${KIT_SIGNALING_PORT:-49100}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - coordinator

  kit-manager-api:
    build:
      context: .
      dockerfile: infra/docker/kit-manager-api.Dockerfile
    environment:
      RUNTIME_MODE: ${RUNTIME_MODE:-docker-container}
      HOST_LOCAL_RUNTIME_ALLOWED: ${HOST_LOCAL_RUNTIME_ALLOWED:-false}
      STORAGE_ROOT: /workspace/storage
      KIT_INSTANCE_ID: ${KIT_INSTANCE_ID:-kit_local_gpu_001}
      KIT_CONTROL_URL: ${KIT_CONTROL_URL:-http://streaming-server:49101}
      KIT_SIGNALING_HOST: 127.0.0.1
      KIT_SIGNALING_PORT: ${KIT_SIGNALING_PORT:-49100}
      KIT_MEDIA_PORT: ${KIT_MEDIA_PORT:-47998}
      KIT_MANAGER_CORS_ORIGINS: ${KIT_MANAGER_CORS_ORIGINS:-http://127.0.0.1:8004}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ${RUNTIME_STORAGE_ROOT:-./storage}:/workspace/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  kit-manager-web:
    build:
      context: .
      dockerfile: infra/docker/kit-manager-web.Dockerfile
      args:
        VITE_COORDINATOR_API_BASE: ${VITE_COORDINATOR_API_BASE:-http://127.0.0.1:8004}
        VITE_VIEWER_URL: ${VITE_VIEWER_URL:-http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      kit-manager-api:
        condition: service_healthy
      coordinator:
        condition: service_started

  streaming-server:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: infra/docker/bim-streaming-server-gpu.Dockerfile
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-graphics,utility,compute,video}
      KIT_INSTANCE_ID: ${KIT_INSTANCE_ID:-kit_local_gpu_001}
      KIT_SIGNALING_PORT: ${KIT_SIGNALING_PORT:-49100}
      KIT_MEDIA_PORT: ${KIT_MEDIA_PORT:-47998}
      KIT_CONTROL_PORT: ${KIT_CONTROL_PORT:-49101}
      STORAGE_ROOT: /workspace/storage
    ports:
      - "${KIT_SIGNALING_PORT:-49100}:${KIT_SIGNALING_PORT:-49100}/tcp"
      - "${KIT_SIGNALING_PORT:-49100}:${KIT_SIGNALING_PORT:-49100}/udp"
      - "${KIT_MEDIA_PORT:-47998}:${KIT_MEDIA_PORT:-47998}/tcp"
      - "${KIT_MEDIA_PORT:-47998}:${KIT_MEDIA_PORT:-47998}/udp"
      - "127.0.0.1:${KIT_CONTROL_PORT:-49101}:${KIT_CONTROL_PORT:-49101}/tcp"
    volumes:
      - ${RUNTIME_STORAGE_ROOT:-./storage}:/workspace/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

approval_policy = "on-request"
default_permissions = "safe-workspace"

[permissions.safe-workspace]
description = "Allow normal autonomous development inside the active repository."
extends = ":workspace"

[permissions.safe-workspace.network]
enabled = true

[permissions.safe-workspace.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"
"registry.npmjs.org" = "allow"
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"

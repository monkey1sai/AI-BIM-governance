rule_set: default-governance
version: "1.0"
description: >
  MVP 治理規則集 — 純 ifcopenshell predicate（不依賴 ifctester / IDS）。
  涵蓋「屬性必填 / 命名規則 / 空間指派」三類，皆從真實 IFC 模型萃取證據。
  IDS-XML 匯入為後續 p1 項目（需先 pip install ifctester 並留下 smoke 證據）。
rules:
  - rule_code: DOOR-FIRERATING-REQUIRED
    target_ifc_type: IfcDoor
    severity: high
    message: 防火門必須在 Pset_DoorCommon 具備 FireRating 屬性
    predicate:
      type: property_required
      pset: Pset_DoorCommon
      property: FireRating

  - rule_code: ELEMENT-NAME-REQUIRED
    target_ifc_type: IfcBuildingElement
    severity: medium
    message: 構件必須具備 Name 屬性
    predicate:
      type: attribute_required
      attribute: Name

  - rule_code: WALL-STOREY-ASSIGNED
    target_ifc_type: IfcWall
    severity: medium
    message: 牆必須被指派到空間結構（樓層 / 空間）
    predicate:
      type: spatial_contained
